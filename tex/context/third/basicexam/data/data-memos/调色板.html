<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>ConTeXt 色板生成器 · OKLCH</title>
  <style>
    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      height: 100%
    }

    body {
      font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #fcfaf5;
      color: #1f1f1f;
      font-size: 14px;
      line-height: 1.6
    }

    code {
      font-family: Consolas, monospace;
      background: #f0ede4;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 12px
    }

    .app {
      display: grid;
      grid-template-columns: 460px 1fr;
      height: 100vh;
      overflow: hidden
    }

    .sidebar {
      overflow-y: auto;
      background: #faf8f3;
      border-right: 1px solid #e6e0d4;
      padding: 20px 18px 60px
    }

    .main {
      overflow-y: auto;
      padding: 20px 24px 80px
    }

    .sidebar::-webkit-scrollbar,
    .main::-webkit-scrollbar {
      width: 10px
    }

    .sidebar::-webkit-scrollbar-thumb,
    .main::-webkit-scrollbar-thumb {
      background: #d6cfc0;
      border-radius: 5px
    }

    .sec {
      margin-bottom: 26px
    }

    .sec-h {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 0 10px
    }

    .sec-h h2 {
      font-size: 14px;
      margin: 0;
      color: #15559a;
      letter-spacing: .3px
    }

    .sec-h .count {
      font-size: 11px;
      color: #8e5806;
      background: #fef0c0;
      padding: 1px 8px;
      border-radius: 10px
    }

    .params {
      background: #fff;
      border: 1px solid #e6e0d4;
      border-radius: 8px;
      padding: 12px
    }

    .params label {
      display: block;
      font-size: 12px;
      color: #535353;
      margin-bottom: 10px
    }

    .params label:last-child {
      margin-bottom: 0
    }

    .params .hd {
      display: flex;
      justify-content: space-between;
      margin-bottom: 3px
    }

    .params .val {
      font-family: Consolas, monospace;
      color: #15559a;
      font-weight: 600
    }

    .params input[type=range] {
      width: 100%;
      margin: 0
    }

    .params input[type=number] {
      width: 100%;
      margin-top: 3px
    }

    .color-row {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 0;
      border-bottom: 1px dashed #ece6d8
    }

    .color-row:last-child {
      border-bottom: none
    }

    .color-row input[type=color] {
      flex: 0 0 30px;
      height: 28px;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 0;
      cursor: pointer;
      background: none
    }

    .color-row input[type=color]:disabled {
      opacity: .3;
      cursor: not-allowed
    }

    .color-row input[type=text] {
      font-family: Consolas, monospace;
      font-size: 12px;
      padding: 3px 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      min-width: 0
    }

    .color-row .hex {
      flex: 0 0 76px
    }

    .color-row .name {
      flex: 1 1 auto
    }

    .color-row select {
      flex: 0 0 88px;
      font-size: 11px;
      padding: 3px 2px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff
    }

    .color-row .del {
      flex: 0 0 22px;
      background: none;
      color: #b1000f;
      border: none;
      font-size: 15px;
      cursor: pointer;
      padding: 0;
      line-height: 1
    }

    .color-row .del:hover {
      color: #5c1e19
    }

    .btn {
      background: #2d69af;
      color: #fff;
      border: none;
      padding: 5px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px
    }

    .btn:hover {
      background: #15559a
    }

    .btn.ghost {
      background: #fff;
      color: #15559a;
      border: 1px solid #b9e6ff
    }

    .btn.ghost:hover {
      background: #eff9ff
    }

    .btn-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap
    }

    table.pt {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px
    }

    table.pt th {
      text-align: left;
      padding: 4px 3px;
      color: #8e5806;
      font-size: 11px;
      font-weight: 600;
      border-bottom: 1px solid #e6e0d4
    }

    table.pt td {
      padding: 3px 0
    }

    table.pt input {
      width: 100%;
      font-size: 12px;
      padding: 3px 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: inherit;
      min-width: 0
    }

    table.pt td.nm {
      width: 30%
    }

    table.pt td.md {
      width: 30%
    }

    table.pt td.op {
      width: 30%
    }

    table.pt td.act {
      width: 24px;
      text-align: center
    }

    table.pt button {
      background: none;
      color: #b1000f;
      border: none;
      font-size: 15px;
      cursor: pointer;
      padding: 0;
      line-height: 1
    }

    table.pt button:hover {
      color: #5c1e19
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 14px;
      margin-bottom: 28px
    }

    .card {
      background: #fff;
      border: 1px solid #e6e0d4;
      border-radius: 9px;
      padding: 12px 14px;
      cursor: pointer;
      transition: box-shadow .18s, transform .18s, border-color .18s
    }

    .card:hover {
      box-shadow: 0 4px 14px rgba(0, 0, 0, .08);
      transform: translateY(-1px);
      border-color: #b9e6ff
    }

    .card h3 {
      margin: 0 0 8px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px
    }

    .mode-tag {
      font-size: 10px;
      padding: 1px 7px;
      border-radius: 8px;
      font-weight: 600;
      letter-spacing: .3px
    }

    .mode-standard {
      background: #eff9ff;
      color: #15559a
    }

    .mode-white {
      background: #f8f8f8;
      color: #7b7b7b;
      border: 1px solid #e6e0d4
    }

    .mode-black {
      background: #1f1f1f;
      color: #e6e0d4
    }

    .swatches {
      display: flex;
      gap: 3px;
      margin: 6px 0 20px
    }

    .swatches>div {
      flex: 1;
      height: 38px;
      border-radius: 4px;
      position: relative;
      border: 1px solid rgba(0, 0, 0, .08)
    }

    .swatches>div span {
      position: absolute;
      bottom: -16px;
      left: 0;
      font-size: 9.5px;
      color: #8e5806;
      white-space: nowrap
    }

    .row {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      padding: 2px 0;
      font-family: Consolas, monospace
    }

    .row .k {
      color: #535353
    }

    .ok {
      color: #2f4f10;
      font-weight: 600
    }

    .warn {
      color: #8e5806;
      font-weight: 600
    }

    .fail {
      color: #5c1e19;
      font-weight: 600
    }

    .dash {
      color: #bbb
    }

    .hint {
      font-size: 10.5px;
      color: #a4a4a4;
      text-align: right;
      margin-top: 6px
    }

    .out-block {
      margin-bottom: 20px;
      border: 1px solid #e6e0d4;
      border-radius: 9px;
      overflow: hidden;
      background: #fff
    }

    .out-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 14px;
      background: #f8f6f0;
      border-bottom: 1px solid #e6e0d4
    }

    .out-head h2 {
      font-size: 13.5px;
      margin: 0;
      color: #15559a
    }

    .out-head .btn {
      padding: 3px 12px;
      font-size: 11.5px
    }

    .out-block pre {
      margin: 0;
      background: #1f1f1f;
      color: #e6e0d4;
      padding: 14px 16px;
      overflow-x: auto;
      font-size: 11.8px;
      line-height: 1.55;
      font-family: Consolas, monospace;
      white-space: pre
    }

    .copied {
      background: #4a7a1e !important
    }

    .note {
      background: #fff4e8;
      border-left: 3px solid #e68615;
      padding: 8px 12px;
      border-radius: 0 6px 6px 0;
      font-size: 12px;
      margin: 10px 0;
      color: #5c3a0a;
      line-height: 1.5
    }

    /* ===== 模态框 ===== */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(20, 16, 10, .55);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px
    }

    .modal.active {
      display: flex
    }

    .modal-content {
      background: #fff;
      border-radius: 12px;
      width: 100%;
      max-width: 820px;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .3)
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid #e6e0d4;
      background: #f8f6f0
    }

    .modal-head h2 {
      margin: 0;
      font-size: 16px;
      color: #15559a;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 26px;
      cursor: pointer;
      color: #7b7b7b;
      padding: 0;
      width: 32px;
      height: 32px;
      line-height: 1;
      border-radius: 6px
    }

    .modal-close:hover {
      background: #f0ede4;
      color: #1f1f1f
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto
    }

    .modal-body::-webkit-scrollbar {
      width: 10px
    }

    .modal-body::-webkit-scrollbar-thumb {
      background: #d6cfc0;
      border-radius: 5px
    }

    .pv {
      background: #fff;
      border-radius: 10px;
      padding: 28px 30px;
      border: 1px solid #e6e0d4
    }

    .pv h1 {
      font-size: 26px;
      margin: 0 0 4px;
      font-weight: 700
    }

    .pv .sub {
      font-size: 13px;
      margin: 0 0 22px;
      font-style: italic
    }

    .pv p {
      font-size: 14px;
      line-height: 1.8;
      margin: 0 0 12px
    }

    .pv blockquote {
      margin: 16px 0;
      padding: 12px 18px;
      border-radius: 0 8px 8px 0
    }

    .pv blockquote p {
      margin: 0;
      font-size: 13.5px
    }

    .pv pre {
      margin: 16px 0;
      padding: 12px 16px;
      border-radius: 8px;
      font-family: Consolas, monospace;
      font-size: 12px;
      overflow-x: auto;
      line-height: 1.55
    }

    .pv .callout {
      margin: 16px 0;
      padding: 12px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13.5px
    }

    .pv .callout small {
      display: block;
      font-size: 10.5px;
      opacity: .75;
      margin-bottom: 3px;
      font-weight: 400
    }

    .pv table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 13px
    }

    .pv table th {
      padding: 8px 12px;
      text-align: left;
      font-weight: 600
    }

    .pv table td {
      padding: 8px 12px;
      border-bottom: 1px solid
    }

    .cr-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      margin-top: 12px;
      background: #fff;
      border: 1px solid #e6e0d4;
      border-radius: 8px;
      overflow: hidden
    }

    .cr-table th {
      background: #f8f6f0;
      padding: 7px 10px;
      text-align: left;
      font-size: 11.5px;
      color: #535353;
      font-weight: 600
    }

    .cr-table td {
      padding: 7px 10px;
      border-top: 1px solid #eee;
      vertical-align: middle
    }

    .cr-table .sw {
      display: inline-block;
      width: 16px;
      height: 16px;
      border-radius: 3px;
      vertical-align: middle;
      margin-right: 6px;
      border: 1px solid rgba(0, 0, 0, .1)
    }

    @media (max-width:960px) {
      .app {
        grid-template-columns: 1fr;
        height: auto;
        overflow: visible
      }

      html,
      body {
        height: auto
      }

      body {
        overflow: auto
      }

      .sidebar,
      .main {
        overflow: visible;
        border-right: none
      }

      .sidebar {
        border-bottom: 1px solid #e6e0d4
      }

      .modal {
        padding: 10px
      }

      .modal-body {
        padding: 14px
      }

      .pv {
        padding: 20px
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <aside class="sidebar">
      <div class="sec">
        <div class="sec-h">
          <h2>全局参数</h2>
        </div>
        <div class="params">
          <label>亮度偏移 <span class="hd"><span></span><span class="val" id="gLv">0.000</span></span>
            <input type="range" id="gL" min="-0.06" max="0.06" step="0.002" value="0">
          </label>
          <label>饱和度缩放 <span class="hd"><span></span><span class="val" id="gCv">1.00</span></span>
            <input type="range" id="gC" min="0.4" max="1.6" step="0.02" value="1">
          </label>
          <label>对比度目标（WCAG）
            <input type="number" id="minCR" value="4.5" step="0.5" min="1" max="21">
          </label>
        </div>
      </div>

      <div class="sec">
        <div class="sec-h">
          <h2>颜色输入</h2><span class="count" id="colorCount">0</span>
        </div>
        <div id="colorRows"></div>
        <div class="btn-row">
          <button class="btn" onclick="addColorRow()">+ 彩色系</button>
          <button class="btn ghost" onclick="addWB()">+ 白/黑系</button>
        </div>
        <div class="note" style="margin-top:8px">点击右侧卡片可预览实际排版效果。</div>
      </div>

      <div class="sec">
        <div class="sec-h">
          <h2>Palette 映射</h2><span class="count" id="paletCount">0</span>
        </div>
        <table class="pt">
          <thead>
            <tr>
              <th class="nm">名称</th>
              <th class="md">主题</th>
              <th class="op">opt</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="paletRows"></tbody>
        </table>
        <div class="btn-row"><button class="btn" onclick="addPalet()">+ Palette</button></div>
      </div>
    </aside>

    <main class="main">
      <div class="sec-h" style="margin-bottom:14px">
        <h2 style="font-size:16px;color:#15559a">色阶预览 <span
            style="font-weight:400;font-size:12px;color:#a4a4a4">点击卡片查看排版预览</span></h2>
      </div>
      <div id="preview" class="grid"></div>

      <div class="out-block">
        <div class="out-head">
          <h2>① 颜色定义 <code style="font-size:11px">\definecolor</code></h2>
          <button class="btn" onclick="copyOut('outColors',this)">复制</button>
        </div>
        <pre id="outColors"></pre>
      </div>

      <div class="out-block">
        <div class="out-head">
          <h2>② Palette 定义 <code style="font-size:11px">\definepalet</code></h2>
          <button class="btn" onclick="copyOut('outPalets',this)">复制</button>
        </div>
        <pre id="outPalets"></pre>
      </div>
    </main>
  </div>

  <!-- 模态框 -->
  <div id="modal" class="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script>
    /* ============ 数学 ============ */
    function hexToRgb(h) { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16) / 255, parseInt(h.slice(2, 4), 16) / 255, parseInt(h.slice(4, 6), 16) / 255] }
    function s2l(c) { return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4) }
    function l2s(c) { return c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055 }
    function rgbToOklab(rgb) {
      const [r, g, b] = rgb.map(s2l);
      const l = 0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b;
      const m = 0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b;
      const s = 0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b;
      const l_ = Math.cbrt(l), m_ = Math.cbrt(m), s_ = Math.cbrt(s);
      return [0.2104542553 * l_ + 0.7936177850 * m_ - 0.0040720468 * s_,
      1.9779984951 * l_ - 2.4285922050 * m_ + 0.4505937099 * s_,
      0.0259040371 * l_ + 0.7827717662 * m_ - 0.8086757660 * s_]
    }
    function oklabToLin(L, a, b) {
      const l_ = L + 0.3963377774 * a + 0.2158037573 * b;
      const m_ = L - 0.1055613458 * a - 0.0638541728 * b;
      const s_ = L - 0.0894841775 * a - 1.2914855480 * b;
      const l = l_ ** 3, m = m_ ** 3, s = s_ ** 3;
      return [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
      -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
      -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s]
    }
    function oklchToLin(L, C, H) { const r = H * Math.PI / 180; return oklabToLin(L, C * Math.cos(r), C * Math.sin(r)) }
    function rgbToOklch(rgb) { const [L, a, b] = rgbToOklab(rgb); const C = Math.hypot(a, b); let H = Math.atan2(b, a) * 180 / Math.PI; if (H < 0) H += 360; return [L, C, H] }
    function inG(l) { return l.every(c => c >= -1e-4 && c <= 1 + 1e-4) }
    function clip(L, C, H) { if (inG(oklchToLin(L, C, H))) return [L, C, H]; let lo = 0, hi = C; for (let i = 0; i < 30; i++) { const m = (lo + hi) / 2; if (inG(oklchToLin(L, m, H))) lo = m; else hi = m } return [L, lo, H] }
    function linToHex(l) { return '#' + l.map(c => { c = Math.max(0, Math.min(1, c)); return Math.round(Math.max(0, Math.min(1, l2s(c))) * 255).toString(16).padStart(2, '0') }).join('') }
    function oklchToHex(L, C, H) { const r = clip(L, C, H); return linToHex(oklchToLin(r[0], r[1], r[2])) }
    function lum(h) { const [r, g, b] = hexToRgb(h).map(s2l); return 0.2126 * r + 0.7152 * g + 0.0722 * b }
    function contrast(a, b) { const y1 = lum(a), y2 = lum(b); const [hi, lo] = y1 > y2 ? [y1, y2] : [y2, y1]; return (hi + 0.05) / (lo + 0.05) }
    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)) }

    /* ============ 档位定义 ============ */
    const ORDER = ['pale', 'soft', 'light', 'base', 'dark', 'deep', 'black'];

    const T_WHITE = {
      pale: { L: 0.995, C: 0.004, H: 80 }, soft: { L: 0.985, C: 0.008, H: 85 }, light: { L: 0.97, C: 0.012, H: 85 },
      dark: { L: 0.955, C: 0.015, H: 85 }, deep: { L: 0.94, C: 0.018, H: 85 }, black: { L: 0.92, C: 0.022, H: 80 }
    };
    const T_BLACK = { pale: 0.95, soft: 0.75, light: 0.55, dark: 0.30, deep: 0.15, black: 0.05 };

    /* ============ 自适应生成（核心修复） ============ */
    function genStandard(baseHex, gL, gC, minCR) {
      const [Lb, Cb, Hb] = rgbToOklch(hexToRgb(baseHex));
      const out = { base: baseHex.toLowerCase() };

      const baseRefL = 0.60;
      const dL = Lb - baseRefL;

      // 目标 L：以 base 的 L 为锚点按比例偏移
      let paleL = clamp(0.97 + dL * 0.10, 0.94, 0.995);
      let softL = clamp(0.93 + dL * 0.15, 0.88, 0.97);
      let lightL = clamp(0.82 + dL * 0.50, 0.68, 0.90);
      let darkL = clamp(0.48 + dL * 0.50, 0.28, 0.58);
      let deepL = clamp(0.34 + dL * 0.40, 0.16, 0.42);
      let blackL = clamp(0.20 + dL * 0.30, 0.06, 0.26);

      // 强制单调：pale > soft > light > base > dark > deep > black
      lightL = Math.max(lightL, Lb + 0.06);
      darkL = Math.min(darkL, Lb - 0.06);
      deepL = Math.min(deepL, darkL - 0.05);
      blackL = Math.min(blackL, deepL - 0.05);
      softL = Math.max(softL, lightL + 0.04);
      paleL = Math.max(paleL, softL + 0.02);

      // 边界保护
      lightL = Math.min(lightL, 0.93);
      softL = Math.min(softL, 0.97);
      paleL = Math.min(paleL, 0.995);
      darkL = Math.max(darkL, 0.18);
      deepL = Math.max(deepL, 0.10);
      blackL = Math.max(blackL, 0.04);

      const targets = {
        pale: { L: paleL, c: 0.10 },
        soft: { L: softL, c: 0.25 },
        light: { L: lightL, c: 0.55 },
        dark: { L: darkL, c: 0.85 },
        deep: { L: deepL, c: 0.65 },
        black: { L: blackL, c: 0.35 },
      };

      for (const [n, t] of Object.entries(targets)) {
        let L = t.L + gL;
        let C = Cb * t.c * gC;
        let hex = oklchToHex(L, C, Hb);

        // 深档做对比度修正
        if (n === 'dark' || n === 'deep' || n === 'black') {
          const bg = out.pale || '#ffffff';
          let k = 0;
          while (contrast(hex, bg) < minCR && L > 0.05 && k < 40) {
            L -= 0.01;
            hex = oklchToHex(L, C, Hb);
            k++;
          }
        }
        out[n] = hex;
      }
      return out;
    }

    function genWhite(gL, gC) {
      const o = { base: '#ffffff' };
      for (const [n, t] of Object.entries(T_WHITE))
        o[n] = oklchToHex(clamp(t.L + gL, 0.85, 0.999), t.C * gC, t.H);
      return o;
    }
    function genBlack(gL) {
      const o = { base: '#000000' };
      for (const [n, L0] of Object.entries(T_BLACK))
        o[n] = oklchToHex(clamp(L0 + gL, 0.02, 0.98), 0, 0);
      return o;
    }

    /* ============ 状态 ============ */
    let colorRows = [
      { name: 'blue', hex: '#2d69af', mode: 'standard' },
      { name: 'red', hex: '#d70c19', mode: 'standard' },
      { name: 'pink', hex: '#e6709a', mode: 'standard' },
      { name: 'purple', hex: '#6f4c9e', mode: 'standard' },
      { name: 'yellow', hex: '#e5a00d', mode: 'standard' },
      { name: 'orange', hex: '#e68615', mode: 'standard' },
      { name: 'green', hex: '#6ba82e', mode: 'standard' },
      { name: 'cyan', hex: '#3c9566', mode: 'standard' },
      { name: 'gray', hex: '#a4a4a4', mode: 'standard' },
      { name: 'white', hex: '#ffffff', mode: 'white' },
      { name: 'black', hex: '#000000', mode: 'black' },
    ];
    let paletRows = [
      { name: 'serene', m: 'blue', opt: 'red' },
      { name: 'harmony', m: 'green', opt: 'blue' },
      { name: 'passion', m: 'red', opt: 'green' },
      { name: 'adventure', m: 'orange', opt: 'cyan' },
      { name: 'optimism', m: 'yellow', opt: 'orange' },
      { name: 'creativity', m: 'cyan', opt: 'yellow' },
      { name: 'magic', m: 'purple', opt: 'pink' },
      { name: 'romance', m: 'pink', opt: 'cyan' },
      { name: 'reliable', m: 'gray', opt: 'purple' },
      { name: 'formality', m: 'gray', opt: 'gray' },
      { name: 'innocence', m: 'blue', opt: 'blue' },
    ];

    /* ============ 左侧渲染 ============ */
    function renderColorRows() {
      const c = document.getElementById('colorRows'); c.innerHTML = '';
      colorRows.forEach((r, i) => {
        const d = document.createElement('div'); d.className = 'color-row';
        const dis = r.mode !== 'standard' ? 'disabled' : '';
        d.innerHTML = `
      <input type="color" value="${r.hex}" ${dis} oninput="onColor(${i},this.value)">
      <input type="text" class="hex" value="${r.hex}" ${dis} oninput="onHex(${i},this.value)">
      <input type="text" class="name" value="${r.name}" oninput="onName(${i},this.value)">
      <select onchange="onMode(${i},this.value)">
        <option value="standard" ${r.mode === 'standard' ? 'selected' : ''}>彩色</option>
        <option value="white" ${r.mode === 'white' ? 'selected' : ''}>白系</option>
        <option value="black" ${r.mode === 'black' ? 'selected' : ''}>黑系</option>
      </select>
      <button class="del" onclick="removeColor(${i})" title="删除">×</button>`;
        c.appendChild(d);
      });
      document.getElementById('colorCount').textContent = colorRows.length;
    }
    function renderPaletRows() {
      const t = document.getElementById('paletRows'); t.innerHTML = '';
      paletRows.forEach((p, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
      <td class="nm"><input type="text" value="${p.name}" oninput="paletRows[${i}].name=this.value;render()"></td>
      <td class="md"><input type="text" value="${p.m}" oninput="paletRows[${i}].m=this.value;render()"></td>
      <td class="op"><input type="text" value="${p.opt}" oninput="paletRows[${i}].opt=this.value;render()"></td>
      <td class="act"><button onclick="paletRows.splice(${i},1);renderPaletRows();render()">×</button></td>`;
        t.appendChild(tr);
      });
      document.getElementById('paletCount').textContent = paletRows.length;
    }

    /* ============ 左侧事件 ============ */
    function onColor(i, v) { colorRows[i].hex = v.toLowerCase(); syncHex(i, v); render() }
    function onHex(i, v) { if (!/^#[0-9a-fA-F]{6}$/.test(v)) return; colorRows[i].hex = v.toLowerCase(); syncColor(i, v); render() }
    function onName(i, v) { colorRows[i].name = v.trim(); render() }
    function onMode(i, v) {
      colorRows[i].mode = v;
      if (v === 'white') colorRows[i].hex = '#ffffff';
      if (v === 'black') colorRows[i].hex = '#000000';
      renderColorRows(); render();
    }
    function syncHex(i, v) { const r = document.querySelectorAll('#colorRows .color-row'); if (r[i]) r[i].querySelector('.hex').value = v }
    function syncColor(i, v) { const r = document.querySelectorAll('#colorRows .color-row'); if (r[i]) r[i].querySelector('input[type=color]').value = v }
    function removeColor(i) { colorRows.splice(i, 1); renderColorRows(); render() }
    function addColorRow() { colorRows.push({ name: 'new', hex: '#888888', mode: 'standard' }); renderColorRows(); render() }
    function addWB() {
      if (!colorRows.find(r => r.mode === 'white')) colorRows.push({ name: 'white', hex: '#ffffff', mode: 'white' });
      if (!colorRows.find(r => r.mode === 'black')) colorRows.push({ name: 'black', hex: '#000000', mode: 'black' });
      renderColorRows(); render();
    }
    function addPalet() { paletRows.push({ name: 'new', m: 'blue', opt: 'red' }); renderPaletRows(); render() }

    /* ============ 主渲染 ============ */
    let allColors = {};

    function render() {
      const gL = parseFloat(document.getElementById('gL').value);
      const gC = parseFloat(document.getElementById('gC').value);
      const minCR = parseFloat(document.getElementById('minCR').value) || 4.5;
      document.getElementById('gLv').textContent = (gL >= 0 ? '+' : '') + gL.toFixed(3);
      document.getElementById('gCv').textContent = gC.toFixed(2);

      allColors = {};
      for (const r of colorRows) {
        if (!r.name) continue;
        if (r.mode === 'standard') allColors[r.name] = genStandard(r.hex, gL, gC, minCR);
        else if (r.mode === 'white') allColors[r.name] = genWhite(gL, gC);
        else if (r.mode === 'black') allColors[r.name] = genBlack(gL);
      }

      // 预览卡片
      const pv = document.getElementById('preview'); pv.innerHTML = '';
      for (const r of colorRows) {
        const t = allColors[r.name]; if (!t) continue;
        const card = document.createElement('div'); card.className = 'card';
        let sw = '<div class="swatches">';
        for (const k of ORDER) sw += `<div style="background:${t[k]}" title="${k} ${t[k]}"><span>${k}</span></div>`;
        sw += '</div>';
        let rows = '';
        const showCR = r.mode === 'standard';
        for (const k of ORDER) {
          if (showCR) {
            const cr = contrast(t[k], t.pale);
            const cls = cr >= 4.5 ? 'ok' : cr >= 3 ? 'warn' : 'fail';
            rows += `<div class="row"><span class="k">${k}</span><span>${t[k]} <span class="${cls}">${cr.toFixed(1)}</span></span></div>`;
          } else {
            rows += `<div class="row"><span class="k">${k}</span><span>${t[k]} <span class="dash">—</span></span></div>`;
          }
        }
        card.innerHTML = `<h3>${r.name}<span class="mode-tag mode-${r.mode}">${r.mode}</span></h3>${sw}${rows}<div class="hint">点击预览排版 →</div>`;
        card.onclick = () => openModal(r, t);
        pv.appendChild(card);
      }

      // 输出颜色
      let oc = '\\startprotectedcolors\n';
      oc += '  \\definecolor [textblack] [x=1f1f1f]\n';
      oc += '  \\definecolor [pagebackground] [x=fcfaf5]\n\n';
      for (const r of colorRows) {
        const t = allColors[r.name]; if (!t) continue;
        oc += `  % ---- ${r.name} (${r.mode}) ----\n`;
        for (const k of ORDER) {
          const cn = k === 'base' ? r.name : k + r.name;
          oc += `  \\definecolor [${cn}] [x=${t[k].replace('#', '')}]\n`;
        }
        oc += '\n';
      }
      oc += '\\stopprotectedcolors\n';
      document.getElementById('outColors').textContent = oc;

      // 输出 palette
      let op = '';
      for (const pr of paletRows) {
        if (!pr.name.trim()) continue;
        const mR = colorRows.find(r => r.name === pr.m);
        const oR = colorRows.find(r => r.name === pr.opt);
        if (!mR || !oR) {
          op += `% ⚠ palette [${pr.name}] 引用了未定义色相：m="${pr.m}", opt="${pr.opt}"\n\n`;
          continue;
        }
        if (mR.mode !== 'standard') {
          op += `% ⚠ palette [${pr.name}] 主题色 "${pr.m}" 是 ${mR.mode} 系，标题/链接对比度会很低\n\n`;
        }
        op += `\\definepalet [${pr.name}] [\n`;
        op += `  palethemecolor=pale${pr.m},  softthemecolor=soft${pr.m},  lightthemecolor=light${pr.m},\n`;
        op += `      themecolor=${pr.m},      darkthemecolor=dark${pr.m},   deepthemecolor=deep${pr.m},\n`;
        op += `                            softbackground=pale${pr.m},   lightoptcolor=soft${pr.opt},\n`;
        op += `                                  optcolor=dark${pr.opt},     darkbackground=deep${pr.m},\n`;
        op += `      titlecolor=dark${pr.m},        textcolor=textblack,         codecolor=deep${pr.m},\n`;
        op += `       linkcolor=dark${pr.m},  footnotecolor=black${pr.m},\n`;
        op += `    captioncolor=deep${pr.m},        toccolor=black${pr.m}, referencecolor=dark${pr.m},\n`;
        op += `]\n\n`;
      }
      document.getElementById('outPalets').textContent = op;
    }

    /* ============ 模态框 ============ */
    function openModal(r, t) {
      const gL = parseFloat(document.getElementById('gL').value);
      const gC = parseFloat(document.getElementById('gC').value);
      const minCR = parseFloat(document.getElementById('minCR').value) || 4.5;

      // 找使用该色系的 palette（取第一个）
      const pr = paletRows.find(p => p.m === r.name);
      let optT = null, optName = null;
      if (pr) {
        const oRow = colorRows.find(x => x.name === pr.opt);
        if (oRow && oRow.mode === 'standard' && allColors[oRow.name]) {
          optT = allColors[oRow.name];
          optName = pr.opt;
        }
      }

      const lightopt = optT ? optT.soft : t.soft;
      const optfg = optT ? optT.dark : t.dark;
      const optLabel = optName ? `opt: ${optName}` : 'opt: 同色系';
      const textblack = '#1f1f1f';

      document.getElementById('modalTitle').innerHTML =
        `${r.name} <span class="mode-tag mode-${r.mode}">${r.mode}</span>`;

      // 对比度表
      const crRows = ORDER.map(k => {
        const cr = contrast(t[k], t.pale);
        const cls = cr >= 4.5 ? 'ok' : cr >= 3 ? 'warn' : 'fail';
        const label = cr >= 4.5 ? '正文可用' : cr >= 3 ? '仅大标题' : '不可读';
        return `<tr>
      <td><span class="sw" style="background:${t[k]}"></span>${k}</td>
      <td style="font-family:Consolas,monospace">${t[k]}</td>
      <td><span class="${cls}">${cr.toFixed(2)}:1</span></td>
      <td style="background:${t.pale}; color:${t[k]}; padding-left:14px;">示例文字 Sample</td>
      <td style="font-size:11.5px;color:#666">${label}</td>
    </tr>`;
      }).join('');

      document.getElementById('modalBody').innerHTML = `
    <div class="pv" style="background:${t.pale};">
      <h1 style="color:${t.dark};">文章标题示例 Heading 1</h1>
      <p class="sub" style="color:${t.deep};">副标题 / caption 使用 deep 颜色 · ${t.deep}</p>

      <p style="color:${textblack};">
        这是正文段落，使用 <code style="background:${t.soft};color:${t.deep};padding:1px 5px;border-radius:3px;font-family:Consolas,monospace;">textblack</code>
        （#1f1f1f）颜色。正文应当清晰可读，与 pale 背景形成足够对比。
        这段文字帮你判断当前色板在长阅读场景下是否舒适，不刺眼也不模糊。
      </p>
      <p style="color:${textblack};">
        这是第二段。链接样式如 <a href="#" style="color:${t.dark};text-decoration:underline;" onclick="return false;">一个链接示例</a>，
        使用 dark 颜色。行内代码 <code style="background:${t.soft};color:${t.deep};padding:1px 5px;border-radius:3px;font-family:Consolas,monospace;">\\definecolor</code>
        使用 soft 背景 + deep 文字。
      </p>

      <blockquote style="background:${t.soft}; border-left:4px solid ${t.dark};">
        <p style="color:${textblack};">引用块：使用 <b>soft</b> 背景 + <b>dark</b> 左边框，正文保持 textblack。适合注意事项、引语、补充说明。</p>
      </blockquote>

      <pre style="background:${t.soft}; color:${t.deep};">\\definepalet [example] [
  titlecolor=dark,
  textcolor=textblack,
  linkcolor=dark,
]</pre>

      <div class="callout" style="background:${lightopt}; color:${optfg};">
        <small>强调块 / callout · ${optLabel}</small>
        lightopt 背景 + opt 前景。用于提示、警告、关键结论。
      </div>

      <table style="border:1px solid ${t.light};">
        <thead>
          <tr>
            <th style="background:${t.soft}; color:${t.dark}; border-bottom:2px solid ${t.light};">档位</th>
            <th style="background:${t.soft}; color:${t.dark}; border-bottom:2px solid ${t.light};">颜色值</th>
            <th style="background:${t.soft}; color:${t.dark}; border-bottom:2px solid ${t.light};">用途</th>
          </tr>
        </thead>
        <tbody>
          <tr><td style="border-bottom:1px solid ${t.light}; color:${textblack};">dark</td><td style="border-bottom:1px solid ${t.light}; font-family:Consolas,monospace; color:${t.dark};">${t.dark}</td><td style="border-bottom:1px solid ${t.light}; color:${textblack};">标题、链接</td></tr>
          <tr><td style="border-bottom:1px solid ${t.light}; color:${textblack};">deep</td><td style="border-bottom:1px solid ${t.light}; font-family:Consolas,monospace; color:${t.deep};">${t.deep}</td><td style="border-bottom:1px solid ${t.light}; color:${textblack};">caption、代码</td></tr>
          <tr><td style="color:${textblack};">base</td><td style="font-family:Consolas,monospace; color:${t.base};">${t.base}</td><td style="color:${textblack};">装饰、色条</td></tr>
        </tbody>
      </table>
    </div>

    <h3 style="margin:22px 0 8px;font-size:14px;color:#15559a;">各档位作为文字（pale 背景上）</h3>
    <table class="cr-table">
      <thead><tr><th>档位</th><th>Hex</th><th>对比度</th><th>预览</th><th>结论</th></tr></thead>
      <tbody>${crRows}</tbody>
    </table>
  `;

      document.getElementById('modal').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal(e) {
      if (e && e.target !== e.currentTarget) return;
      document.getElementById('modal').classList.remove('active');
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });

    /* ============ 复制 ============ */
    function copyOut(id, btn) {
      const txt = document.getElementById(id).textContent;
      navigator.clipboard.writeText(txt).then(() => {
        const old = btn.textContent;
        btn.textContent = '已复制'; btn.classList.add('copied');
        setTimeout(() => { btn.textContent = old; btn.classList.remove('copied') }, 1200);
      }).catch(() => {
        const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
        ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
        btn.textContent = '已复制'; setTimeout(() => btn.textContent = '复制', 1200);
      });
    }

    /* ============ 初始化 ============ */
    document.addEventListener('DOMContentLoaded', () => {
      renderColorRows();
      renderPaletRows();
      ['gL', 'gC', 'minCR'].forEach(id => document.getElementById(id).addEventListener('input', render));
      render();
    });
  </script>
</body>

</html>
