<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Question Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    /* ===================================================================
       DESIGN TOKENS — Apple HIG
       =================================================================== */
    :root {
      --accent:       #007AFF;
      --accent-hover: #0062CC;
      --accent-glow:  rgba(0,122,255,0.10);
      --success:      #34C759;
      --danger:       #FF3B30;
      --warning:      #FF9500;

      --bg:           #F7F7F7;
      --card:         #F9F9F9;
      --surface-solid:#FFFFFF;
      --surface:      rgba(255,255,255,0.5);
      --separator:    rgba(60,60,67,0.12);
      --border:       rgba(0,0,0,0.06);
      --surface-hover:rgba(0,0,0,0.04);
      --surface-active:rgba(0,0,0,0.08);

      --text-1: #000000;
      --text-2: #3C3C4399;
      --text-3: #3C3C434D;

      --fs-display: 2rem;
      --fs-title:   1.25rem;
      --fs-body:    1rem;
      --fs-sub:     0.875rem;
      --fs-sm:      0.75rem;
      --fs-xs:      0.6875rem;

      --fw-regular: 400;
      --fw-medium:  500;
      --fw-semibold:600;

      --sp-1: 0.25rem;
      --sp-2: 0.5rem;
      --sp-3: 0.75rem;
      --sp-4: 1rem;
      --sp-6: 1.5rem;
      --sp-8: 2rem;

      --r-xs: 4px;
      --r-sm: 8px;
      --r-md: 12px;
      --r-lg: 16px;

      --left-w: 280px;
      --right-w: 400px;
      --nav-h: 52px;
      --touch: 32px;
      --action-bar-h: 50px;
      --spring: 300ms cubic-bezier(0.25, 0.1, 0.25, 1);
      --instant: 80ms ease-out;
    }

    /* ===== Base ===== */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-1);
      overflow: hidden;
      line-height: 1.47059;
      font-size: var(--fs-body);
      -webkit-font-smoothing: antialiased;
    }

    /* ===== Navbar ===== */
    .navbar {
      background: var(--surface) !important;
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 0.5px solid var(--separator);
      padding: 0 var(--sp-4);
      height: var(--nav-h);
      z-index: 1030;
    }
    .navbar > .container-fluid { gap: var(--sp-2); }

    .navbar-brand { font-weight: var(--fw-semibold); color: var(--text-1) !important; font-size: var(--fs-body); }
    .navbar-brand i { color: var(--accent); }

    .navbar-center { flex: 1; min-width: 0; max-width: 680px; margin: 0 auto; }
    .navbar-center .input-group { max-width: 320px; min-width: 120px; }

    /* ===== Panel Toggle ===== */
    .panel-toggle-btn {
      width: var(--touch); height: var(--touch);
      border: none; background: transparent; cursor: pointer;
      border-radius: var(--r-sm); color: var(--text-2);
      transition: background var(--spring), color var(--spring);
    }
    .panel-toggle-btn:hover { background: var(--surface-hover); color: var(--text-1); }
    .panel-toggle-btn:active { background: var(--surface-active); transform: scale(0.95); transition: transform var(--instant); }
    .panel-toggle-btn.active { color: var(--accent); }
    .panel-toggle-btn.active:hover { background: rgba(0,122,255,0.18); }

    /* ===== App Container ===== */
    .app-container { display: flex; height: calc(100vh - var(--nav-h)); overflow: hidden; }
    .panel { display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .panel-content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

    /* ===== Left Panel ===== */
    .left-panel {
      width: var(--left-w); min-width: var(--left-w);
      background: var(--surface); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-right: 0.5px solid var(--separator);
      transition: transform var(--spring), opacity var(--spring);
    }
    .left-panel.collapsed { transform: translateX(-100%); position: absolute; left: 0; top: 0; bottom: 0; z-index: 1040; opacity: 0; pointer-events: none; }

    /* ===== Right Panel ===== */
    .right-panel {
      width: var(--right-w); min-width: var(--right-w);
      background: var(--surface); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-left: 0.5px solid var(--separator);
      transition: transform var(--spring), opacity var(--spring);
    }
    .right-panel.collapsed { transform: translateX(100%); position: absolute; right: 0; top: 0; bottom: 0; z-index: 1040; opacity: 0; pointer-events: none; }

    .middle-panel { flex: 1; min-width: 300px; background: var(--bg); }

    /* ===== Left Panel Content ===== */
    .left-panel .card { border: none; border-radius: var(--r-md); box-shadow: none; background: var(--card); }
    .left-panel .card-header { background: transparent; border-bottom: none; font-weight: var(--fw-semibold); font-size: var(--fs-sub); color: var(--text-1); }
    .stats-number { font-size: var(--fs-title); font-weight: var(--fw-semibold); color: var(--text-1); line-height: 1; }
    .stats-label { font-size: var(--fs-xs); font-weight: var(--fw-medium); color: var(--text-3); }

    /* ===== Tag Cloud ===== */
    .tag-cloud .badge { cursor: pointer; transition: background 150ms ease; display: inline-flex; align-items: center; line-height: 1.4; }
    .tag-cloud .badge:active { transform: scale(0.95); }

    /* ===== Form Overrides ===== */
    .form-select, .form-control { border-color: var(--separator); border-radius: var(--r-sm); font-size: var(--fs-sub); }
    .form-select:focus, .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    .form-label { font-size: var(--fs-sm); font-weight: var(--fw-medium); color: var(--text-2); }

    /* ===== Table ===== */
    .question-table-container { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .question-table-container table { font-size: var(--fs-sub); }
    .question-table-container table th {
      position: sticky; top: 0; background: var(--bg); z-index: 2;
      font-size: var(--fs-xs); font-weight: var(--fw-semibold); color: var(--text-3); white-space: nowrap;
      border-bottom: 0.5px solid var(--separator);
    }
    .question-table-container table td { vertical-align: middle; border-bottom: 0.5px solid rgba(0,0,0,0.04); }
    .question-table-container .table-hover tbody tr { transition: background 150ms ease; cursor: pointer; }
    .question-table-container .table-hover tbody tr:hover { background-color: rgba(0,122,255,0.04); }
    .question-table-container .table-hover tbody tr:active { background-color: rgba(0,122,255,0.08); }

    /* ===== Badge — monochrome chips ===== */
    .badge { font-weight: var(--fw-medium); border-radius: var(--r-sm); font-size: var(--fs-sm); display: inline-flex; align-items: center; }
    .badge.bg-primary { background: var(--accent-glow) !important; color: var(--accent) !important; }
    .badge.bg-secondary { background: var(--surface-solid) !important; color: var(--text-2) !important; }
    .badge.bg-success { background: rgba(52,199,89,0.12) !important; color: var(--success) !important; }
    .badge.bg-info { background: var(--accent-glow) !important; color: var(--accent) !important; }
    .badge.bg-warning { background: rgba(255,149,0,0.12) !important; color: var(--warning) !important; }
    .badge.bg-light { background:  var(--surface-solid) !important; color: var(--text-2) !important; }

    /* ===== Buttons ===== */
    .btn { border-radius: var(--r-sm); font-weight: var(--fw-medium); transition: background var(--spring), transform var(--instant), box-shadow var(--spring); }
    .btn:active { transform: scale(0.97); }
    .btn-group-sm .btn { min-height: auto; padding: 0.25rem 0.5rem; }
    .btn-primary, .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover, .btn-accent:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn-outline-secondary { border-color: var(--separator); color: var(--text-2); }
    .btn-outline-secondary:hover { background: var(--surface-hover); border-color: var(--separator); color: var(--text-1); }
    .btn-outline-secondary.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-outline-primary { color: var(--accent); border-color: rgba(0,122,255,0.3); }
    .btn-outline-primary:hover { background: var(--accent-glow); border-color: var(--accent); color: var(--accent); }
    .btn-outline-success { color: var(--success); border-color: rgba(52,199,89,0.3); }
    .btn-outline-success:hover { background: rgba(52,199,89,0.08); border-color: var(--success); color: var(--success); }
    .btn-outline-danger { color: var(--danger); border-color: rgba(255,59,48,0.3); }
    .btn-outline-danger:hover { background: rgba(255,59,48,0.08); border-color: var(--danger); color: var(--danger); }
    .btn-ghost { background: transparent; border: none; color: var(--accent); }
    .btn-ghost:hover { background: var(--accent-glow); }

    /* ===== Right Panel — iOS grouped list ===== */
    .right-panel-section { border-radius: var(--r-md); overflow: hidden; background: var(--card); }
    .right-panel-section + .right-panel-section { margin-top: var(--sp-4); }
    .right-panel-section .section-header { font-weight: var(--fw-semibold); font-size: var(--fs-sm); color: var(--text-1); }
    .detail-group { background: var(--card); border-radius: var(--r-md); overflow: hidden; }
    .detail-group + .detail-group { margin-top: var(--sp-4); }
    .detail-group-header { font-size: var(--fs-sm); font-weight: var(--fw-medium); color: var(--text-3); padding: var(--sp-2) var(--sp-4) var(--sp-1); }
    .detail-row { display: flex; align-items: flex-start; padding: var(--sp-3) var(--sp-4); border-bottom: 0.5px solid var(--separator); }
    .detail-row:last-child { border-bottom: none; }
    .detail-key { flex-shrink: 0; width: 5rem; font-size: var(--fs-sub); color: var(--text-2); padding-top: 1px; }
    .detail-val { flex: 1; font-size: var(--fs-sub); color: var(--text-1); min-width: 0; word-break: break-word; }
    .detail-val .badge { margin-right: var(--sp-1); margin-bottom: var(--sp-1); }
    .detail-content { padding: var(--sp-3) var(--sp-4); border-bottom: 0.5px solid var(--separator); }
    .detail-content:last-child { border-bottom: none; }
    .detail-content-label { font-size: var(--fs-sm); font-weight: var(--fw-medium); color: var(--text-3); margin-bottom: var(--sp-1); }
    .option-item { background: transparent; transition: background 150ms ease; font-size: var(--fs-sub); display: flex; align-items: center; padding: var(--sp-2) var(--sp-4); border-bottom: 0.5px solid var(--separator); }
    .option-item:last-child { border-bottom: none; }
    .option-item:hover { background: var(--surface-hover); }
    .option-item.correct { background: rgba(52,199,89,0.06); }
    .option-item .form-check-label { opacity: 1 !important; color: var(--text-1) !important; }
    .option-item .form-check-input:disabled { opacity: 1; }
    .preview-container { background: var(--card); border-radius: var(--r-sm); min-height: 200px; }
    #pdfCanvas { max-width: 100%; height: auto; border-radius: var(--r-xs); }
    .no-compile-hint { background: var(--card); border-radius: var(--r-sm); }

    /* ===== Edit Form ===== */
    .edit-form .form-label { font-size: var(--fs-sm); }
    .edit-form .form-control, .edit-form .form-select { font-size: var(--fs-sub); }

    /* ===== Sortable ===== */
    .sortable { user-select: none; cursor: pointer; transition: color 150ms ease; }
    .sortable:hover { color: var(--accent); }
    .sortable i { font-size: var(--fs-xs); opacity: 0.4; margin-left: 2px; }

    /* ===== Toast — Apple material ===== */
    .toast-container { position: fixed; top: calc(var(--nav-h) + var(--sp-3)); right: var(--sp-4); z-index: 9999; display: flex; flex-direction: column; gap: var(--sp-2); }
    .toast {
      min-width: 280px; max-width: 380px;
      background: var(--surface); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
      box-shadow: 0 4px 24px rgba(0,0,0,0.12), 0 0 0 0.5px var(--separator);
      border-radius: var(--r-md); border: none;
      overflow: hidden;
      animation: toast-in 300ms cubic-bezier(0.25, 0.1, 0.25, 1) both;
    }
    .toast.hiding { animation: toast-out 200ms cubic-bezier(0.25, 0.1, 0.25, 1) both; }
    @keyframes toast-in { from { transform: translateX(100%) scale(0.95); opacity: 0; } to { transform: translateX(0) scale(1); opacity: 1; } }
    @keyframes toast-out { from { transform: translateX(0) scale(1); opacity: 1; } to { transform: translateX(100%) scale(0.95); opacity: 0; } }
    .toast-header { border-bottom: none; padding: var(--sp-2) var(--sp-3) 0; font-size: var(--fs-sub); font-weight: var(--fw-semibold); }
    .toast-body { padding: var(--sp-1) var(--sp-3) var(--sp-2); font-size: var(--fs-sub); color: var(--text-2); min-height: 3rem; display:flex; align-items: center;}
    .toast .btn-close { opacity: 0.3; }
    .toast .btn-close:hover { opacity: 0.7; }

    @media (prefers-reduced-motion: reduce) {
      .toast { animation: toast-in-reduced 200ms ease both; }
      .toast.hiding { animation: toast-out-reduced 150ms ease both; }
      @keyframes toast-in-reduced { from { opacity: 0; } to { opacity: 1; } }
      @keyframes toast-out-reduced { from { opacity: 1; } to { opacity: 0; } }
    }

    /* ===== Scrollbar ===== */
    .panel-content::-webkit-scrollbar, .question-table-container::-webkit-scrollbar { width: 6px; }
    .panel-content::-webkit-scrollbar-track, .question-table-container::-webkit-scrollbar-track { background: transparent; }
    .panel-content::-webkit-scrollbar-thumb, .question-table-container::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }
    .panel-content::-webkit-scrollbar-thumb:hover, .question-table-container::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.25); }

    /* ===== Panel Backdrop ===== */
    .panel-backdrop { position: fixed; inset: 0; z-index: 1035; background: rgba(0,0,0,0.3); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity var(--spring); }
    .panel-backdrop.visible { opacity: 1; pointer-events: auto; }

    /* ===== Mobile Action Bar ===== */
    .mobile-action-bar {
      display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 1030;
      background: var(--surface); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-top: 0.5px solid var(--separator);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .mobile-action-bar .action-item {
      background: none; border: none; cursor: pointer; color: var(--text-3);
      font-size: 0.625rem; border-radius: var(--r-sm);
      flex: 1; padding: 0.4rem 0;
      transition: color 150ms ease, background 150ms ease;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    }
    .mobile-action-bar .action-item i { font-size: 1.25rem; line-height: 1; }
    .mobile-action-bar .action-item:active { color: var(--accent); background: var(--accent-glow); }
    .mobile-action-bar .action-item.active { color: var(--accent); }
    .mobile-action-bar .action-item-danger { color: var(--danger); }
    .mobile-action-bar .action-item-danger:active { color: var(--danger); background: rgba(255,59,48,0.08); }

    /* ===== Responsive — Large Tablet ===== */
    @media (max-width: 1200px) {
      :root { --right-w: 340px; }
    }

    /* ===== Responsive — Small Tablet ===== */
    @media (max-width: 992px) {
      :root { --left-w: 256px; --right-w: 320px; }
      .navbar-center .input-group { max-width: 200px; }
      .navbar-center { max-width: 520px; }
    }

    /* ===== Responsive — Tablet portrait (intermediate) ===== */
    @media (max-width: 860px) {
      :root { --left-w: 240px; --right-w: 300px; }
      .navbar-center { max-width: 400px; }
      .navbar-brand span { display: none; }
      .navbar-brand { margin-right: var(--sp-1) !important; }
      .navbar > .container-fluid { gap: var(--sp-1); }
      /* Source column too cramped, hide it early */
      .question-table-container table th:nth-child(6),
      .question-table-container table td:nth-child(6) { display: none; }
    }

    /* ===== Responsive — Mobile ===== */
    @media (max-width: 768px) {
      :root { --fs-body: 1rem; --fs-sub: 0.9375rem; --fs-sm: 0.8125rem; --fs-xs: 0.75rem; --nav-h: 48px; --touch: 44px; --action-bar-h: 50px; }
      .mobile-action-bar { display: flex; }
      .app-container { height: calc(100vh - var(--nav-h) - var(--action-bar-h) - env(safe-area-inset-bottom, 0px)); }
      .navbar-center .btn-group { display: none; }
      .navbar-brand span { display: none; }
      .navbar-center { max-width: none; }
      .navbar-center .input-group { max-width: none; flex: 1; }
      .left-panel {
        position: fixed; left: 0; top: var(--nav-h); bottom: 0; z-index: 1040;
        width: 85vw !important; min-width: 0 !important; max-width: 320px;
        box-shadow: 8px 0 32px rgba(0,0,0,0.12);
      }
      .left-panel.collapsed { transform: translateX(-100%); opacity: 0; pointer-events: none; }
      .right-panel {
        position: fixed; right: 0; top: var(--nav-h); bottom: 0; z-index: 1040;
        width: 100vw !important; min-width: 0 !important; max-width: 420px;
        box-shadow: -8px 0 32px rgba(0,0,0,0.12);
      }
      .right-panel.collapsed { transform: translateX(100%); opacity: 0; pointer-events: none; }
      .middle-panel { min-width: 0; }
      .question-table-container table td { padding: var(--sp-2) var(--sp-1); }
      .btn { min-height: var(--touch); }
      .tag-cloud .badge { min-height: var(--touch); padding: var(--sp-1) var(--sp-2); }
      .form-select, .form-control { min-height: var(--touch); }
      .option-item { min-height: var(--touch); }
      .question-table-container .btn-sm { min-width: var(--touch); min-height: var(--touch); }
      .question-table-container table th:nth-child(6), .question-table-container table td:nth-child(6) { display: none; }
      .left-panel .card { margin-bottom: var(--sp-4); }
      .left-panel .form-select { font-size: var(--fs-sub); }
      .detail-group .detail-row { padding: var(--sp-2) var(--sp-3); }
      .right-panel .panel-content { padding: var(--sp-3); }
      /* Toast responsive */
      .toast { min-width: auto; max-width: calc(100vw - var(--sp-8)); }
      .toast-container { right: var(--sp-2); left: var(--sp-2); }
      /* detail-key wider for CJK labels on mobile */
      .detail-key { width: 4.5rem; }
      /* Navbar compact on mobile */
      .navbar { padding: 0 var(--sp-1); }
      .navbar > .container-fluid { gap: var(--sp-1); }
      .navbar-brand { margin-right: var(--sp-1) !important; }
      /* Right side toggle buttons need touch spacing */
      .d-flex.gap-2.ms-auto { gap: var(--sp-2); }
    }

    /* ===== Responsive — Small phone ===== */
    @media (max-width: 480px) {
      :root { --fs-sub: 1rem; }
      .question-table-container table th:nth-child(5), .question-table-container table td:nth-child(5) { display: none; }
      /* Right panel full width on small phones */
      .right-panel { max-width: none !important; width: 100vw !important; }
    }

    /* ===== Responsive — Very small phone ===== */
    @media (max-width: 360px) {
      :root { --left-w: 0px; --right-w: 0px; --fs-body: 0.9375rem; --fs-sub: 0.875rem; }
      .navbar-center { gap: var(--sp-1); }
      .panel-toggle-btn { width: 36px; height: 36px; }
      .detail-key { width: 3.5rem; font-size: var(--fs-sm); }
      .detail-val { font-size: var(--fs-sm); }
      .mobile-action-bar .action-item { font-size: 0.5625rem; }
      .mobile-action-bar .action-item i { font-size: 1.125rem; }
    }

    /* ===== Responsive — Landscape mobile ===== */
    @media (max-width: 768px) and (orientation: landscape) {
      :root { --nav-h: 40px; --action-bar-h: 44px; }
      .left-panel { max-width: 260px; top: var(--nav-h); }
      .right-panel { max-width: 360px; top: var(--nav-h); }
      .mobile-action-bar .action-item { padding: 0.25rem 0; }
      .mobile-action-bar .action-item i { font-size: 1.125rem; }
    }

    /* ===== Export Modal ===== */
    #exportModal .modal-dialog { max-width: 560px; }
    #exportModal .modal-body { padding: 0; }
    #exportModal .tab-content { padding: var(--sp-4); max-height: 50vh; overflow-y: auto; }
    .export-tab-nav { padding: var(--sp-2) var(--sp-4) 0; background: var(--surface); border-bottom: 0.5px solid var(--separator); }
    .export-tab-nav .nav-link { font-size: var(--fs-sub); font-weight: var(--fw-medium); color: var(--text-3); border: none; padding: var(--sp-2) var(--sp-3); border-radius: var(--r-md) var(--r-md) 0 0; transition: color 150ms ease, background 150ms ease; }
    .export-tab-nav .nav-link:hover { color: var(--text-1); background: var(--surface-hover); }
    .export-tab-nav .nav-link.active { color: var(--accent); background: var(--card); border-bottom: 2px solid var(--accent); }
    .export-bottom-options { padding: var(--sp-3) var(--sp-4); border-top: 0.5px solid var(--separator); display: flex; align-items: center; gap: var(--sp-6); flex-wrap: wrap; }
    .export-bottom-options .form-check { margin-bottom: 0; }
    .export-bottom-options .form-check-label { font-size: var(--fs-sub); }
    .export-format-group { display: flex; align-items: center; gap: var(--sp-3); font-size: var(--fs-sub); }
    .export-format-group .form-check { margin-bottom: 0; }
    .export-q-item { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2) var(--sp-3); border-bottom: 0.5px solid var(--separator); background: var(--card); transition: background 150ms ease; cursor: grab; }
    .export-q-item:hover { background: var(--surface-hover); }
    .export-q-item.dragging { opacity: 0.5; background: var(--accent-glow); }
    .export-q-item .drag-handle { color: var(--text-3); cursor: grab; font-size: var(--fs-sub); }
    .export-q-item .q-order { font-size: var(--fs-sm); color: var(--accent); font-weight: var(--fw-semibold); min-width: 1.5rem; text-align: center; }
    .export-q-item .q-summary { flex: 1; font-size: var(--fs-sub); color: var(--text-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .export-q-item .q-move-btns { display: flex; flex-direction: column; gap: 0; }
    .export-q-item .q-move-btns .btn { padding: 0 0.375rem; min-height: auto; font-size: var(--fs-xs); line-height: 1; }
    .export-q-empty { padding: var(--sp-6) var(--sp-3); text-align: center; color: var(--text-3); font-size: var(--fs-sub); }
    @media (max-width: 768px) {
      #exportModal .modal-dialog { max-width: 100vw; margin: 0; }
      #exportModal .modal-content { border-radius: 0; height: 100vh; }
      #exportModal .tab-content { max-height: calc(100vh - 240px); }
      .export-q-item .q-summary { font-size: var(--fs-sm); max-width: 50vw; }
      .export-q-item .drag-handle { display: none; }
      .export-q-item { cursor: default; }
      .export-bottom-options { gap: var(--sp-4); }
    }

    /* ===== A11y ===== */
    @media (prefers-reduced-motion: reduce) {
      .left-panel, .right-panel, .btn, .panel-toggle-btn, .tag-cloud .badge, .question-table-container .table-hover tbody tr { transition: opacity 200ms ease !important; }
      .btn:active, .panel-toggle-btn:active, .tag-cloud .badge:active { transform: none !important; }
    }
    @media (prefers-reduced-transparency: reduce) {
      .navbar, .left-panel, .right-panel, .mobile-action-bar, .toast { background: var(--card) !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
    }
  </style>
</head>

<body>
  <!-- ===== Navbar ===== -->
  <nav class="navbar navbar-expand navbar-light sticky-top">
    <div class="container-fluid d-flex align-items-center">
      <!-- Left panel toggle (always visible) -->
      <button class="panel-toggle-btn active" onclick="toggleLeftPanel()" id="leftToggleBtn" title="筛选面板">
        <i class="bi bi-layout-sidebar-inset"></i>
      </button>

      <a class="navbar-brand me-2" href="#" id="navBrand">
        <i class="bi bi-journal-bookmark"></i> <span id="systemTitle"></span>
      </a>

      <div class="navbar-center d-flex align-items-center justify-content-center gap-2">
        <div class="input-group input-group-sm">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input type="text" class="form-control" id="searchInput" oninput="filterQuestions()">
        </div>
        <div class="btn-group btn-group-sm" role="group">
          <button class="btn btn-accent" onclick="openCreateModal()" id="newBtn" data-bs-toggle="tooltip" data-bs-placement="bottom">
            <i class="bi bi-plus-circle"></i>
          </button>
          <button class="btn btn-outline-primary" onclick="compileSelected()" id="compileBtn" data-bs-toggle="tooltip" data-bs-placement="bottom">
            <i class="bi bi-gear"></i>
          </button>
          <button class="btn btn-outline-primary" onclick="openExportModal()" id="exportBtn" data-bs-toggle="tooltip" data-bs-placement="bottom">
            <i class="bi bi-download"></i>
          </button>
          <button class="btn btn-outline-danger" onclick="deleteSelected()" id="deleteBtn" data-bs-toggle="tooltip" data-bs-placement="bottom">
            <i class="bi bi-trash"></i>
          </button>
        </div>
      </div>

      <div class="d-flex align-items-center gap-2 ms-auto">
        <button class="panel-toggle-btn active" onclick="toggleLanguage()" id="langToggleBtn" title="切换至 English">
          <i class="bi bi-translate"></i>
        </button>
        <!-- Right panel toggle (always visible) -->
        <button class="panel-toggle-btn" onclick="toggleRightPanel()" id="rightToggleBtn" title="详情面板">
          <i class="bi bi-layout-sidebar-inset-reverse"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- ===== Three-Column Layout ===== -->
  <div class="panel-backdrop" id="panelBackdrop" onclick="closeAllPanels()"></div>
  <div class="app-container">

    <!-- ===== Left Panel: Filters & Stats ===== -->
    <div class="panel left-panel" id="leftPanel">
      <div class="panel-content p-3">
        <div class="card mb-3">
          <div class="card-header p-2 px-3 pb-1" id="statsHeader">
            <i class="bi bi-bar-chart"></i> <span id="statisticsText"></span>
          </div>
          <div class="card-body p-2 px-3 pb-3">
            <div class="row g-2">
              <div class="col-6">
                <div class="stats-card text-center p-2" style="background: var(--surface-solid); border-radius: var(--r-sm);">
                  <div class="stats-number mb-1" id="totalQuestions">0</div>
                  <div class="stats-label" id="totalLabel"></div>
                </div>
              </div>
              <div class="col-6">
                <div class="stats-card text-center p-2" style="background: var(--surface-solid); border-radius: var(--r-sm);">
                  <div class="stats-number mb-1" id="compiledQuestions">0</div>
                  <div class="stats-label" id="compiledLabel"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="card mb-3">
          <div class="card-header p-2 px-3 pb-1" id="filterHeader">
            <i class="bi bi-funnel"></i> <span id="filterText"></span>
          </div>
          <div class="card-body p-2 px-3 pb-3">
            <div class="mb-3">
              <label class="form-label mb-1" for="typeFilter" id="typeLabel"></label>
              <select class="form-select form-select-sm" id="typeFilter" onchange="applyFilters()"></select>
            </div>
            <div class="mb-3">
              <label class="form-label mb-1" for="yearFilter" id="yearLabel"></label>
              <select class="form-select form-select-sm" id="yearFilter" onchange="applyFilters()"></select>
            </div>
            <div class="mb-3">
              <label class="form-label mb-1" for="sourceFilter" id="sourceLabel"></label>
              <select class="form-select form-select-sm" id="sourceFilter" onchange="applyFilters()"></select>
            </div>
            <div>
              <label class="form-label mb-1" for="tagFilter" id="tagsLabel"></label>
              <div id="tagFilter" class="tag-cloud d-flex flex-wrap gap-1"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== Middle Panel: Question List ===== -->
    <div class="panel middle-panel" id="middlePanel">
      <div class="panel-content d-flex flex-column p-3 px-4">
        <div class="d-flex align-items-center justify-content-between pb-2 mb-2 flex-shrink-0">
          <div class="form-check mb-0">
            <input type="checkbox" class="form-check-input" id="selectAll" onchange="toggleSelectAll()">
            <label class="form-check-label" for="selectAll" id="selectAllLabel"></label>
          </div>
          <span class="text-muted" id="questionCountLabel" style="font-size: var(--fs-sm);"></span>
        </div>
        <div class="question-table-container">
          <table class="table table-hover table-sm" id="questionList">
            <thead>
              <tr>
                <th style="width: 32px;"></th>
                <th style="width: 46px;" onclick="sortQuestions('id')" class="sortable">
                  ID <i class="bi bi-arrow-down-up"></i>
                </th>
                <th style="width: 66px;" onclick="sortQuestions('type')" class="sortable" id="typeHeader">
                  <i class="bi bi-arrow-down-up"></i>
                </th>
                <th onclick="sortQuestions('content')" class="sortable" id="contentHeader">
                  <i class="bi bi-arrow-down-up"></i>
                </th>
                <th style="width: 54px;" onclick="sortQuestions('point')" class="sortable" id="pointHeader">
                  <i class="bi bi-arrow-down-up"></i>
                </th>
                <th style="width: 76px;" onclick="sortQuestions('source')" class="sortable" id="sourceHeader">
                  <i class="bi bi-arrow-down-up"></i>
                </th>
                <th style="width: 52px;" onclick="sortQuestions('year')" class="sortable" id="yearHeader">
                  <i class="bi bi-arrow-down-up"></i>
                </th>
                <th style="width: 56px;" id="actionsHeader"></th>
              </tr>
            </thead>
            <tbody id="questionTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ===== Right Panel: Detail & Preview ===== -->
    <div class="panel right-panel collapsed" id="rightPanel">
      <div class="panel-content p-4 d-flex flex-column gap-4" id="rightPanelContent">
        <!-- Empty state -->
        <div class="empty-state text-center px-4 py-5" style="color: var(--text-3);" id="rightPanelEmpty">
          <i class="bi bi-file-text d-block mb-2" style="font-size: var(--fs-display); opacity: 0.4;"></i>
          <p class="mb-0" id="selectQuestionHint" style="font-size: var(--fs-sub);"></p>
        </div>

        <!-- Detail view -->
        <div id="rightPanelDetail" style="display: none;">
          <div class="right-panel-section">
            <div class="section-header d-flex align-items-center justify-content-between p-2 px-3 pb-1">
              <span><i class="bi bi-info-circle me-1"></i> <span id="detailTitleText"></span></span>
              <div class="btn-group btn-group-sm">
                <button class="btn btn-outline-primary btn-sm" onclick="editCurrentQuestion()" id="editBtn">
                  <i class="bi bi-pencil"></i> <span id="editBtnText"></span>
                </button>
                <button class="btn btn-outline-primary btn-sm" onclick="compileCurrentQuestion()" id="compileCurrentBtn">
                  <i class="bi bi-gear"></i> <span id="compileBtnText"></span>
                </button>
              </div>
            </div>
            <div class="section-body pb-3">
              <div id="detailBody"></div>
            </div>
          </div>
          <div class="right-panel-section">
            <div class="section-header p-2 px-3 pb-1">
              <span style="cursor: pointer;" onclick="openPreviewModal()" id="previewSectionHeader">
                <i class="bi bi-eye me-1"></i> <span id="previewText"></span>
                <i class="bi bi-arrows-fullscreen ms-1" style="font-size: 0.65rem; opacity: 0.5;"></i>
              </span>
            </div>
            <div class="section-body p-2 px-3 pb-3" style="cursor: pointer;" onclick="openPreviewModal()">
              <div class="preview-container d-flex align-items-center justify-content-center p-2" id="previewContainer">
                <canvas id="pdfCanvas"></canvas>
              </div>
            </div>
          </div>
        </div>

        <!-- Edit form — iOS grouped list style -->
        <div id="rightPanelEdit" style="display: none;" class="edit-form">
          <form id="questionForm">
            <input type="hidden" id="questionId">
            <input type="hidden" id="questionType" value="choice">

            <!-- Group: 基本信息 -->
            <div class="detail-group-header"><i class="bi bi-info-circle me-1"></i> <span id="editFormTitle"></span></div>
            <div class="detail-group">
              <div class="detail-row">
                <div class="detail-key"><label for="questionTypeSelect" id="typeSelectLabel" style="color: inherit;"></label></div>
                <div class="detail-val">
                  <select class="form-select form-select-sm" id="questionTypeSelect" onchange="selectQuestionType(this.value)">
                    <option value="choice" id="choiceOption"></option>
                    <option value="question" id="questionOption"></option>
                    <option value="multi_question" id="multiQuestionOption"></option>
                    <option value="writing" id="writingOption"></option>
                    <option value="multi_writing" id="multiWritingOption"></option>
                    <option value="material" id="materialOption"></option>
                  </select>
                </div>
              </div>
              <div class="detail-row">
                <div class="detail-key"><label for="questionPoint" id="pointLabel" style="color: inherit;"></label></div>
                <div class="detail-val">
                  <input type="number" class="form-control form-control-sm" id="questionPoint" value="1" min="0.5" step="0.5">
                </div>
              </div>
            </div>

            <!-- Group: 题目内容 -->
            <div class="detail-group-header" id="contentGroupHeader"></div>
            <div class="detail-group">
              <div class="detail-content">
                <label class="form-label mb-1" for="questionContent" id="contentLabel"></label>
                <textarea class="form-control form-control-sm" id="questionContent" rows="2" style="resize: vertical;"></textarea>
              </div>
              <div id="choiceOptions">
                <div class="detail-content">
                  <label class="form-label mb-1" for="answersList" id="optionsLabel"></label>
                  <div id="answersList"></div>
                  <button type="button" class="btn btn-ghost btn-sm mt-1" onclick="addAnswer()" id="addOptionBtn">
                    <i class="bi bi-plus"></i> <span id="addOptionText"></span>
                  </button>
                </div>
              </div>
              <div id="materialOptions" style="display: none;">
                <div class="detail-content">
                  <label class="form-label mb-1" for="materialTitle" id="materialTitleLabel"></label>
                  <input type="text" class="form-control form-control-sm" id="materialTitle">
                </div>
                <div class="detail-content">
                  <label class="form-label mb-1" for="materialContent" id="materialContentLabel"></label>
                  <textarea class="form-control form-control-sm" id="materialContent" rows="3"></textarea>
                </div>
                <div class="detail-content">
                  <label class="form-label mb-1" id="subQuestionsLabel"></label>
                  <div id="subQuestionsList"></div>
                  <button type="button" class="btn btn-ghost btn-sm mt-1" onclick="addSubQuestion()" id="addSubQuestionBtn">
                    <i class="bi bi-plus"></i> <span id="addSubQuestionText"></span>
                  </button>
                </div>
              </div>
              <div id="multiOptions" style="display: none;">
                <div class="detail-content">
                  <label class="form-label mb-1" id="multiSubQuestionsLabel"></label>
                  <div id="multiSubQuestionsList"></div>
                  <button type="button" class="btn btn-ghost btn-sm mt-1" onclick="addMultiSubQuestion()" id="addMultiSubQuestionBtn">
                    <i class="bi bi-plus"></i> <span id="addMultiSubQuestionText"></span>
                  </button>
                </div>
              </div>
            </div>

            <!-- Group: 答案与解析 -->
            <div class="detail-group-header" id="answerGroupHeader"></div>
            <div class="detail-group">
              <div class="detail-content">
                <label class="form-label mb-1" for="questionAnswer" id="answerLabel"></label>
                <textarea class="form-control form-control-sm" id="questionAnswer" rows="2" style="resize: vertical;"></textarea>
              </div>
              <div class="detail-content">
                <label class="form-label mb-1" for="questionExplanation" id="explanationLabel"></label>
                <textarea class="form-control form-control-sm" id="questionExplanation" rows="2" style="resize: vertical;"></textarea>
              </div>
            </div>

            <!-- Group: 元数据 -->
            <div class="detail-group-header" id="metadataGroupHeader"></div>
            <div class="detail-group">
              <div class="detail-row">
                <div class="detail-key"><label for="questionSource" id="sourceInputLabel" style="color: inherit;"></label></div>
                <div class="detail-val">
                  <input type="text" class="form-control form-control-sm" id="questionSource">
                </div>
              </div>
              <div class="detail-row">
                <div class="detail-key"><label for="questionYear" id="yearInputLabel" style="color: inherit;"></label></div>
                <div class="detail-val">
                  <input type="number" class="form-control form-control-sm" id="questionYear">
                </div>
              </div>
              <div class="detail-row">
                <div class="detail-key"><label for="questionTags" id="tagsInputLabel" style="color: inherit;"></label></div>
                <div class="detail-val">
                  <input type="text" class="form-control form-control-sm" id="questionTags">
                </div>
              </div>
            </div>
          </form>
          <div class="d-flex gap-2 mt-3">
            <button type="button" class="btn btn-accent btn-sm" onclick="saveQuestion()" id="saveBtn"></button>
            <button type="button" class="btn btn-ghost btn-sm" onclick="cancelEdit()" id="cancelBtn"></button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- ===== Export Modal ===== -->
  <div class="modal fade" id="exportModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content" style="border-radius: var(--r-lg); border: none; box-shadow: 0 24px 80px rgba(0,0,0,0.16);">
        <div class="modal-header" style="border-bottom: none; padding-bottom: 0;">
          <h5 class="modal-title" style="font-size: var(--fs-body); font-weight: 600;">
            <i class="bi bi-download me-1"></i> <span id="exportModalTitle"></span>
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <!-- Tab navigation: Order → Page → Style -->
          <ul class="nav nav-tabs export-tab-nav" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active" id="exportOrderTab" data-bs-toggle="tab" data-bs-target="#exportOrderPane" type="button" role="tab">
                <i class="bi bi-list-ol me-1"></i><span id="exportOrderTabLabel"></span>
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="exportPageTab" data-bs-toggle="tab" data-bs-target="#exportPagePane" type="button" role="tab">
                <i class="bi bi-file-earmark me-1"></i><span id="exportPageTabLabel"></span>
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="exportStyleTab" data-bs-toggle="tab" data-bs-target="#exportStylePane" type="button" role="tab">
                <i class="bi bi-palette me-1"></i><span id="exportStyleTabLabel"></span>
              </button>
            </li>
          </ul>
          <!-- Tab content -->
          <div class="tab-content">
            <!-- Tab 1: Question Order (default active) -->
            <div class="tab-pane fade show active" id="exportOrderPane" role="tabpanel">
              <div id="exportQuestionList"></div>
            </div>
            <!-- Tab 2: Page Settings -->
            <div class="tab-pane fade" id="exportPagePane" role="tabpanel">
              <div class="detail-group">
                <div class="detail-row">
                  <span class="detail-key" id="exportPapersizeLabel"></span>
                  <span class="detail-val">
                    <select class="form-select form-select-sm" id="exportPapersize">
                      <option value="A3">A3</option>
                      <option value="A4" selected>A4</option>
                      <option value="A5">A5</option>
                      <option value="B5">B5</option>
                      <option value="ipad">ipad</option>
                      <option value="kindle">kindle</option>
                    </select>
                  </span>
                </div>
                <div class="detail-row">
                  <span class="detail-key" id="exportLayoutLabel"></span>
                  <span class="detail-val">
                    <select class="form-select form-select-sm" id="exportLayout">
                      <option value="narrow">narrow</option>
                      <option value="moderate" selected>moderate</option>
                      <option value="wide">wide</option>
                      <option value="extrawide">extrawide</option>
                      <option value="exotic">exotic</option>
                      <option value="kaolike">kaolike</option>
                      <option value="ipad">ipad</option>
                      <option value="kindle">kindle</option>
                      <option value="sidemirror">sidemirror</option>
                      <option value="propiorroot">propiorroot</option>
                      <option value="propiorgolden">propiorgolden</option>
                      <option value="hermes">hermes</option>
                    </select>
                  </span>
                </div>
                <!-- Hermes-only fields -->
                <div id="exportHermesFields" style="display: none;">
                  <div class="detail-row">
                    <span class="detail-key" id="exportTextcountLabel"></span>
                    <span class="detail-val">
                      <input type="number" class="form-control form-control-sm" id="exportTextcount" value="40" min="10" max="100" style="width:5rem;">
                    </span>
                  </div>
                  <div class="detail-row">
                    <span class="detail-key" id="exportHeightcountLabel"></span>
                    <span class="detail-val">
                      <input type="number" class="form-control form-control-sm" id="exportHeightcount" value="40" min="10" max="100" style="width:5rem;">
                    </span>
                  </div>
                  <div class="detail-row">
                    <span class="detail-key" id="exportMargincountLabel"></span>
                    <span class="detail-val">
                      <input type="number" class="form-control form-control-sm" id="exportMargincount" value="0" min="0" max="10" style="width:5rem;">
                    </span>
                  </div>
                </div>
                <div class="detail-row">
                  <span class="detail-key" id="exportDoublesidedLabel"></span>
                  <span class="detail-val">
                    <select class="form-select form-select-sm" id="exportDoublesided">
                      <option value="no" selected>no</option>
                      <option value="yes">yes</option>
                    </select>
                  </span>
                </div>
              </div>
            </div>
            <!-- Tab 3: Style Settings -->
            <div class="tab-pane fade" id="exportStylePane" role="tabpanel">
              <div class="detail-group">
                <div class="detail-row">
                  <span class="detail-key" id="exportBodyfontLabel"></span>
                  <span class="detail-val">
                    <select class="form-select form-select-sm" id="exportBodyfont">
                      <option value="adobehans" selected>adobehans</option>
                      <option value="sourcehans">sourcehans</option>
                      <option value="sinohans">sinohans</option>
                      <option value="modern">modern</option>
                    </select>
                  </span>
                </div>
                <div class="detail-row">
                  <span class="detail-key" id="exportFontsizeLabel"></span>
                  <span class="detail-val">
                    <select class="form-select form-select-sm" id="exportFontsize">
                      <option value="9pt">9pt</option>
                      <option value="10pt">10pt</option>
                      <option value="11pt" selected>11pt</option>
                      <option value="12pt">12pt</option>
                      <option value="14pt">14pt</option>
                    </select>
                  </span>
                </div>
                <div class="detail-row">
                  <span class="detail-key" id="exportFontstyleLabel"></span>
                  <span class="detail-val">
                    <select class="form-select form-select-sm" id="exportFontstyle">
                      <option value="rm" selected>rm</option>
                      <option value="ss">ss</option>
                      <option value="tt">tt</option>
                    </select>
                  </span>
                </div>
                <div class="detail-row">
                  <span class="detail-key" id="exportThemecolorLabel"></span>
                  <span class="detail-val">
                    <select class="form-select form-select-sm" id="exportThemecolor">
                      <option value="">—</option>
                      <option value="serene">serene</option>
                      <option value="harmony">harmony</option>
                      <option value="passion">passion</option>
                      <option value="adventure">adventure</option>
                      <option value="optimism">optimism</option>
                      <option value="creativity">creativity</option>
                      <option value="magic">magic</option>
                      <option value="romance">romance</option>
                      <option value="reliable">reliable</option>
                      <option value="formality">formality</option>
                      <option value="innocence">innocence</option>
                    </select>
                  </span>
                </div>

    function isMobile() {
      return window.innerWidth <= 768;

    function updateBackdrop() {
      const backdrop = document.getElementById('panelBackdrop');
      if (!backdrop) return;
      const show = isMobile() && (!leftPanelCollapsed || !rightPanelCollapsed);
      backdrop.classList.toggle('visible', show);
    }

    function closeAllPanels() {
      if (!leftPanelCollapsed) toggleLeftPanel();
      if (!rightPanelCollapsed) toggleRightPanel();
    }

    function toggleLeftPanel() {
      leftPanelCollapsed = !leftPanelCollapsed;
      const panel = document.getElementById('leftPanel');
      const btn = document.getElementById('leftToggleBtn');
      panel.classList.toggle('collapsed', leftPanelCollapsed);
      btn.classList.toggle('active', !leftPanelCollapsed);
      btn.title = leftPanelCollapsed
        ? (currentLang === 'zh' ? '展开筛选面板' : 'Show filter panel')
        : (currentLang === 'zh' ? '收起筛选面板' : 'Hide filter panel');
      // Update mobile action bar filter button active state
      const mobileFilterBtn = document.getElementById('mobileFilterBtn');
      if (mobileFilterBtn) mobileFilterBtn.classList.toggle('active', !leftPanelCollapsed);
      updateBackdrop();
    }

    function toggleRightPanel() {
      rightPanelCollapsed = !rightPanelCollapsed;
      const panel = document.getElementById('rightPanel');
      const btn = document.getElementById('rightToggleBtn');
      panel.classList.toggle('collapsed', rightPanelCollapsed);
      btn.classList.toggle('active', !rightPanelCollapsed);

    // ===== KaTeX =====
    function renderMath(text) {
      if (!text) return '';
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = text;
      if (typeof window.renderMathInElement === 'function') {
        window.renderMathInElement(tempDiv, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false },
            { left: '\\[', right: '\\]', display: true },
            { left: '\\(', right: '\\)', display: false }
          ],
          throwOnError: false
        });
      }
      return tempDiv.innerHTML;
    }

    // ===== Toast =====
    function showToast(message, type = 'info', title = null) {
      const toastContainer = document.getElementById('toastContainer');
      const toastId = 'toast-' + Date.now();

      const iconColor = type === 'success' ? 'var(--success)' :
        type === 'error' ? 'var(--danger)' :
          type === 'warning' ? 'var(--warning)' : 'var(--accent)';

      const icon = type === 'success' ? 'check-circle-fill' :
        type === 'error' ? 'x-circle-fill' :
          type === 'warning' ? 'exclamation-triangle-fill' : 'info-circle-fill';

      const delay = type === 'error' ? 5000 : 3000;

      const defaultTitle = type === 'success' ? (currentLang === 'zh' ? '操作成功' : 'Success') :
        type === 'error' ? (currentLang === 'zh' ? '操作失败' : 'Error') :
          type === 'warning' ? (currentLang === 'zh' ? '警告' : 'Warning') : (currentLang === 'zh' ? '提示' : 'Info');

      const toastHtml = `
        <div id="${toastId}" class="toast" role="alert">
          <div class="toast-header d-flex align-items-center">
            <i class="bi bi-${icon} me-2" style="color: ${iconColor}; font-size: 1rem;"></i>
            <strong class="me-auto" style="color: var(--text-1);">${title || defaultTitle}</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast" style="font-size: 0.6rem;"></button>
          </div>
          <div class="toast-body">${message}</div>
        </div>
      `;

      toastContainer.insertAdjacentHTML('beforeend', toastHtml);
      const toastElement = document.getElementById(toastId);
      const toast = new bootstrap.Toast(toastElement, { delay: delay });
      toast.show();

      toastElement.addEventListener('hidden.bs.toast', () => {
        toastElement.classList.add('hiding');
        setTimeout(() => toastElement.remove(), 200);
      });
    }

    // ===== API =====
    async function loadStats() {
      try {
        const response = await fetch(`${API_BASE}/stats`);
        const data = await response.json();
        document.getElementById('totalQuestions').textContent = data.total_questions || 0;
        document.getElementById('compiledQuestions').textContent = data.compiled_count || 0;
      } catch (error) {
        console.error('加载统计失败:', error);
      }
    }

    let selectedTags = new Set();

    async function loadQuestions() {
      try {
        const response = await fetch(`${API_BASE}/questions`);
        const data = await response.json();
        allQuestions = Array.isArray(data) ? data : (data.questions || []);

        const years = [...new Set(allQuestions.map(q => q.year).filter(y => y))].sort((a, b) => b - a);
        const sources = [...new Set(allQuestions.map(q => q.source).filter(s => s))].sort();

        const yearFilter = document.getElementById('yearFilter');
        yearFilter.innerHTML = `<option value="">${i18n[currentLang].all}</option>` +
          years.map(y => `<option value="${y}">${y}</option>`).join('');

        const sourceFilter = document.getElementById('sourceFilter');
        sourceFilter.innerHTML = `<option value="">${i18n[currentLang].all}</option>` +
          sources.map(s => `<option value="${s}">${escapeHtml(s)}</option>`).join('');

        displayQuestions(allQuestions);
        loadStats();
        loadTags();
      } catch (error) {
        console.error('加载题目失败:', error);
      }
    }

    async function loadTags() {
      try {
        const response = await fetch(`${API_BASE}/tags`);
        const data = await response.json();
        const tags = Array.isArray(data) ? data : (data.tags || []);

        const tagFilter = document.getElementById('tagFilter');
        tagFilter.innerHTML = tags.map(tag =>
          `<span class="badge ${selectedTags.has(tag) ? 'bg-primary' : 'bg-secondary'}" style="cursor: pointer;" onclick="toggleTagFilter('${escapeHtml(tag)}')">${escapeHtml(tag)}</span>`
        ).join('');
      } catch (error) {
        console.error('加载标签失败:', error);
      }
    }

    function toggleTagFilter(tag) {
      if (selectedTags.has(tag)) {
        selectedTags.delete(tag);
      } else {
        selectedTags.add(tag);
      }

      const tagFilter = document.getElementById('tagFilter');
      tagFilter.querySelectorAll('.badge').forEach(badge => {
        if (badge.textContent === tag) {
          badge.className = `badge ${selectedTags.has(tag) ? 'bg-primary' : 'bg-secondary'}`;
        }
      });

      applyFilters();
    }

    // ===== Display Questions =====
    function displayQuestions(questions) {
      const tbody = document.getElementById('questionTableBody');

      if (questions.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="8" class="text-center py-5" style="color: var(--text-3);">
              <i class="bi bi-inbox" style="font-size: var(--fs-display); margin-bottom: var(--sp-2); display: block; opacity: 0.4;"></i>

        return `
          <tr onclick="showQuestionDetail(${q.id})">

    // ===== Sort & Filter =====
    function sortQuestions(field) {
      if (sortField === field) {
        sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
      } else {
        sortField = field;
        sortOrder = 'asc';
      }

      allQuestions.sort((a, b) => {
        let aVal = a[field];
        let bVal = b[field];

        if (field === 'type') {
          aVal = getTypeName(aVal);
          bVal = getTypeName(bVal);
        } else if (field === 'pdf_url') {
          aVal = aVal ? 1 : 0;
          bVal = bVal ? 1 : 0;
        } else if (aVal === null || aVal === undefined) {
          aVal = '';
        } else if (bVal === null || bVal === undefined) {
          bVal = '';
        }

        if (typeof aVal === 'string') {
          aVal = aVal.toLowerCase();
          bVal = bVal.toLowerCase();
        }

        if (aVal < bVal) return sortOrder === 'asc' ? -1 : 1;
        if (aVal > bVal) return sortOrder === 'asc' ? 1 : -1;
        return 0;
      });

      applyFilters();
    }

    function filterQuestions() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allQuestions.filter(q =>
        q.content.toLowerCase().includes(searchTerm) ||
        (q.source && q.source.toLowerCase().includes(searchTerm)) ||
        (q.tags && q.tags.some(tag => tag.toLowerCase().includes(searchTerm)))
      );
      displayQuestions(filtered);
    }

    function applyFilters() {
      const type = document.getElementById('typeFilter').value;
      const year = document.getElementById('yearFilter').value;
      const source = document.getElementById('sourceFilter').value;

      let filtered = allQuestions;

      if (type) filtered = filtered.filter(q => q.type === type);
      if (year) filtered = filtered.filter(q => q.year == year);
      if (source) filtered = filtered.filter(q => q.source === source);

      if (selectedTags.size > 0) {
        filtered = filtered.filter(q => {
          if (!q.tags || !Array.isArray(q.tags)) return false;
          return [...selectedTags].some(tag => q.tags.includes(tag));
        });
      }

      displayQuestions(filtered);
    }

    function toggleQuestion(id, event) {
      event.stopPropagation();
      if (selectedQuestions.has(id)) {
        selectedQuestions.delete(id);
      } else {
        selectedQuestions.add(id);
      }
    }

    function toggleSelectAll() {
      const selectAllCheckbox = document.getElementById('selectAll');
      const checkboxes = document.querySelectorAll('#questionTableBody input[type="checkbox"]');

      if (selectAllCheckbox.checked) {
        allQuestions.forEach(q => selectedQuestions.add(q.id));
        checkboxes.forEach(cb => cb.checked = true);
      } else {
        selectedQuestions.clear();
        checkboxes.forEach(cb => cb.checked = false);
      }
    }

    // ===== Show Question Detail in Right Panel =====
    function showQuestionDetail(id) {
      const question = allQuestions.find(q => q.id === id);
      if (!question) return;

      currentQuestion = question;
      showRightPanelView();

      let html = '';

      // Group 1: Question info (key-value rows)
      html += `
        <div class="detail-group-header">${i18n[currentLang].questionInfo}</div>
        <div class="detail-group">
          <div class="detail-row">
            <div class="detail-key">${i18n[currentLang].questionType}</div>
            <div class="detail-val"><span class="badge bg-primary">${getTypeName(question.type)}</span></div>
          </div>
          <div class="detail-row">
            <div class="detail-key">${i18n[currentLang].points}</div>
            <div class="detail-val">${question.point}${currentLang === 'zh' ? ' 分' : ' pts'}</div>
          </div>
          ${question.source ? `
          <div class="detail-row">
            <div class="detail-key">${i18n[currentLang].source}</div>
            <div class="detail-val">${escapeHtml(question.source)}</div>
          </div>` : ''}
          ${question.year ? `
          <div class="detail-row">
            <div class="detail-key">${i18n[currentLang].year}</div>
            <div class="detail-val">${question.year}</div>
          </div>` : ''}
          ${question.tags && question.tags.length > 0 ? `
          <div class="detail-row">
            <div class="detail-key">${i18n[currentLang].tags}</div>
            <div class="detail-val">${question.tags.map(t => `<span class="badge bg-light">${escapeHtml(t)}</span>`).join('')}</div>
          </div>` : ''}
        </div>
      `;

      // Group 2: Question content
      html += `
        <div class="detail-group-header">${i18n[currentLang].questionContent}</div>
        <div class="detail-group">
          <div class="detail-content">
            <div class="mb-0">${renderMath(escapeHtml(question.content))}</div>
          </div>
      `;

      if (question.type === 'choice' && question.answers && question.answers.length > 0) {
        html += question.answers.map((ans, idx) => `
          <div class="option-item ${ans.is_correct ? 'correct' : ''}">
            <div class="form-check mb-0">
              <input class="form-check-input" type="radio" disabled ${ans.is_correct ? 'checked' : ''}>
              <label class="form-check-label d-inline">
                <strong class="me-2">${String.fromCharCode(65 + idx)}.</strong>
                ${renderMath(escapeHtml(ans.content))}
                ${ans.is_correct ? '<i class="bi bi-check-circle-fill text-success ms-2"></i>' : ''}
              </label>
            </div>
          </div>
        `).join('');
      }

      html += `</div>`;

      // Group 3: Answer & explanation
      if (question.answer || question.explanation) {
        html += `
          <div class="detail-group-header">${i18n[currentLang].answer}</div>
          <div class="detail-group">
        `;

        if (question.answer) {
          html += `
            <div class="detail-content">
              <div class="detail-content-label">${i18n[currentLang].referenceAnswer}</div>
              <div class="mb-0">${renderMath(escapeHtml(question.answer))}</div>
            </div>
          `;
        }

        if (question.explanation) {
          html += `
            <div class="detail-content">
              <div class="detail-content-label">${i18n[currentLang].explanation}</div>
              <div class="mb-0">${renderMath(escapeHtml(question.explanation))}</div>
            </div>
          `;
        }

        html += `</div>`;
      }

      document.getElementById('detailBody').innerHTML = html;

      document.getElementById('detailTitleText').textContent = `${i18n[currentLang].questionDetails} #${id}`;

      // Render PDF preview
      const previewContainer = document.getElementById('previewContainer');
      previewContainer.innerHTML = `<canvas id="pdfCanvas" style="width: 100%; height: auto;"></canvas>`;

      if (question.pdf_url) {
        setTimeout(() => renderPDF(question.pdf_url), 100);
      } else {
        previewContainer.innerHTML = `
          <div class="no-compile-hint text-center p-4 px-3" style="color: var(--text-2);">
            <i class="bi bi-file-earmark-pdf d-block mb-2" style="font-size: var(--fs-display); opacity: 0.4;"></i>
            <p class="mb-2" style="font-size: var(--fs-sub);">${i18n[currentLang].notCompiled}</p>
            <button class="btn btn-outline-primary btn-sm" onclick="compileQuestion(${id}, event)">
              <i class="bi bi-gear"></i> ${i18n[currentLang].compileNow}
            </button>
          </div>
        `;
      }

      // Auto-expand right panel if collapsed
      if (rightPanelCollapsed) {
        toggleRightPanel();
      }

      // On mobile, auto-collapse left panel when showing detail

        toggleLeftPanel();
      }

      document.getElementById('questionTypeSelect').value = currentQuestion.type;

    // ===== Question Type Selection =====
    function selectQuestionType(type) {
      document.getElementById('questionType').value = type;

      const choiceOptions = document.getElementById('choiceOptions');
      const materialOptions = document.getElementById('materialOptions');
      const multiOptions = document.getElementById('multiOptions');
      const answerInput = document.getElementById('questionAnswer');

      if (type === 'choice') {
        choiceOptions.style.display = 'block';
        materialOptions.style.display = 'none';
        multiOptions.style.display = 'none';
        answerInput.placeholder = currentLang === 'zh' ? '例如：A' : 'e.g., A';
        if (document.getElementById('answersList').children.length === 0) {
          addAnswer();
          addAnswer();
        }
      } else if (type === 'material') {
        choiceOptions.style.display = 'none';
        materialOptions.style.display = 'block';
        multiOptions.style.display = 'none';
        answerInput.placeholder = '';
        answerInput.value = '';
      } else if (type === 'multi_question' || type === 'multi_writing') {
        choiceOptions.style.display = 'none';
        materialOptions.style.display = 'none';
        multiOptions.style.display = 'block';
        answerInput.placeholder = '';
        answerInput.value = '';
      } else {
        choiceOptions.style.display = 'none';
        materialOptions.style.display = 'none';
        multiOptions.style.display = 'none';
        answerInput.placeholder = i18n[currentLang].answerPlaceholder;
      }
    }

    function addAnswer() {
      const answersList = document.getElementById('answersList');
      const index = answersList.children.length;
      const letter = String.fromCharCode(65 + index);

      const answerHtml = `
        <div class="input-group input-group-sm mb-1">
          <span class="input-group-text">${letter}</span>
          <input type="text" class="form-control answer-content" placeholder="${i18n[currentLang].options}">
          <div class="input-group-text">
            <input class="form-check-input" type="checkbox" title="${currentLang === 'zh' ? '正确答案' : 'Correct answer'}">
          </div>
          <button type="button" class="btn btn-outline-danger" onclick="removeAnswer(this)">
            <i class="bi bi-trash"></i>
          </button>
        </div>
      `;

      answersList.insertAdjacentHTML('beforeend', answerHtml);
    }

    function removeAnswer(btn) {
      btn.closest('.input-group').remove();
      updateAnswerLabels();
    }

    function updateAnswerLabels() {
      const answersList = document.getElementById('answersList');
      const answers = answersList.querySelectorAll('.input-group');
      answers.forEach((answer, idx) => {
        const label = answer.querySelector('.input-group-text');
        label.textContent = String.fromCharCode(65 + idx);
      });
    }

    let subQuestionCounter = 0;

      const subQuestionsList = document.getElementById('subQuestionsList');
