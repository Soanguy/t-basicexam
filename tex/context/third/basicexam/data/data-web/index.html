    // ===== Save Question =====
    async function saveQuestion() {
      const questionId = document.getElementById('questionId').value;
      const type = document.getElementById('questionType').value;
      const content = document.getElementById('questionContent').value;
      const point = parseFloat(document.getElementById('questionPoint').value) || 1;
      const answer = document.getElementById('questionAnswer').value;
      const explanation = document.getElementById('questionExplanation').value;
      const source = document.getElementById('questionSource').value;
      const year = parseInt(document.getElementById('questionYear').value) || null;
      const tagsInput = document.getElementById('questionTags').value;
      const tags = tagsInput ? tagsInput.split(',').map(t => t.trim()).filter(t => t) : [];

      const questionData = { type, content, point, answer, explanation, source, year, tags };

      if (type === 'choice') {
        const answersList = document.getElementById('answersList');
        const answerInputs = answersList.querySelectorAll('.input-group');
        const answers = [];
        answerInputs.forEach((input, idx) => {
          const content = input.querySelector('.answer-content').value;
          const isCorrect = input.querySelector('.form-check-input').checked;
          if (content) {
            answers.push({ content, is_correct: isCorrect ? 1 : 0, position: idx });
          }
        });
        questionData.answers = answers;
        questionData.answer = answer || 'A';
      } else if (type === 'material') {
        const materialTitle = document.getElementById('materialTitle').value;
        const materialContent = document.getElementById('materialContent').value;
        const subQuestionsList = document.getElementById('subQuestionsList');
        const subQuestionCards = subQuestionsList.querySelectorAll('.card');
        const subQuestions = [];
        subQuestionCards.forEach((card, idx) => {
          const subType = card.querySelector('.sub-question-type').value;
          const subPoint = parseFloat(card.querySelector('.sub-question-point').value) || 1;
          const subAnswer = card.querySelector('.sub-question-answer').value;
          const subContent = card.querySelector('.sub-question-content').value;
          const subExplanation = card.querySelector('.sub-question-explanation').value;
          const subQuestionData = { type: subType, content: subContent, point: subPoint, answer: subAnswer, explanation: subExplanation };
          if (subType === 'choice') {
            const subAnswersList = card.querySelector('.sub-answers-list');
            const subAnswerInputs = subAnswersList.querySelectorAll('.input-group');
            const subAnswers = [];
            subAnswerInputs.forEach((input, aIdx) => {
              const content = input.querySelector('.sub-answer-content').value;
              const isCorrect = input.querySelector('.form-check-input').checked;
              if (content) { subAnswers.push({ content, is_correct: isCorrect ? 1 : 0, position: aIdx }); }
            });
            subQuestionData.answers = subAnswers;
            subQuestionData.answer = subAnswer || 'A';
          }
          subQuestions.push(subQuestionData);
        });
        questionData.material_title = materialTitle;
        questionData.material_content = materialContent;
        questionData.sub_questions = subQuestions;
      } else if (type === 'multi_question' || type === 'multi_writing') {
        const multiSubQuestionsList = document.getElementById('multiSubQuestionsList');
        const subQuestionCards = multiSubQuestionsList.querySelectorAll('.card');
        const subQuestions = [];
        subQuestionCards.forEach((card, idx) => {
          const subContent = card.querySelector('.multi-sub-content').value;
          const subAnswer = card.querySelector('.multi-sub-answer').value;
          const subPoint = parseFloat(card.querySelector('.multi-sub-point').value) || 1;
          const subExplanation = card.querySelector('.multi-sub-explanation').value;
          if (subContent) {
            subQuestions.push({ type: 'problem', content: subContent, point: subPoint, answer: subAnswer, explanation: subExplanation, position: idx });
          }
        });
        questionData.sub_questions = subQuestions;
      }

      try {
        const url = questionId ? `${API_BASE}/questions/${questionId}` : `${API_BASE}/questions`;
        const method = questionId ? 'PUT' : 'POST';
        const response = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(questionData) });
        const result = await response.json();
        if (response.ok) {
          showToast(i18n[currentLang].saveSuccess, 'success');
          loadQuestions();
          if (result.id) { showQuestionDetail(result.id); } else { showRightPanelEmpty(); }
        } else {
          showToast(result.error || 'Error', 'error');
        }
      } catch (error) {
        console.error('保存失败:', error);
        showToast('Error', 'error');
      }
    }

    // ===== PDF Preview =====
    async function renderPDF(url) {
      try {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const timestamp = Date.now();
        const pdfUrl = url.includes('?') ? `${url}&t=${timestamp}` : `${url}?t=${timestamp}`;
        const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
        const page = await pdf.getPage(1);
        const canvas = document.getElementById('pdfCanvas');
        if (!canvas) return false;
        const context = canvas.getContext('2d');
        if (!context) return false;
        const container = canvas.parentElement;
        if (!container) return false;
        let containerWidth = container.clientWidth - 16;
        let containerHeight = container.clientHeight - 16;
        if (containerWidth <= 0 || containerHeight <= 0) { containerWidth = Math.max(containerWidth, 280); containerHeight = Math.max(containerHeight, 300); }
        const viewport = page.getViewport({ scale: 1 });
        const scale = Math.min(containerWidth / viewport.width, containerHeight / viewport.height, 3);
        const scaledViewport = page.getViewport({ scale: scale * 2 });
        canvas.width = scaledViewport.width;
        canvas.height = scaledViewport.height;
        canvas.style.width = scaledViewport.width / 2 + 'px';
        canvas.style.height = scaledViewport.height / 2 + 'px';
        await page.render({ canvasContext: context, viewport: scaledViewport }).promise;
        return true;
      } catch (error) {
        console.error('PDF渲染失败:', error);
        return false;
      }
    }

    // ===== PDF Preview Modal =====
    let previewModalPdfUrl = null;
    let previewModalPdfDoc = null;
    let previewModalCurrentZoom = 1;    // 1 = fit-to-container
    let previewModalBaseScale = 1;      // scale at zoom=1

    function openPreviewModal() {
      if (!currentQuestion || !currentQuestion.pdf_url) return;

      previewModalPdfUrl = currentQuestion.pdf_url;
      previewModalCurrentZoom = 1;

      document.getElementById('previewModalTitle').textContent =
        `${i18n[currentLang].preview} #${currentQuestion.id}`;

      const modal = new bootstrap.Modal(document.getElementById('previewModal'));
      modal.show();

      // Render after modal is shown (needs dimensions)
      const modalEl = document.getElementById('previewModal');
      const onShown = async () => {
        modalEl.removeEventListener('shown.bs.modal', onShown);
        await renderPreviewModal(true);
      };
      modalEl.addEventListener('shown.bs.modal', onShown);
    }

    function previewModalZoom(direction) {
      // direction: 1 = zoom in, -1 = zoom out, 0 = fit
      if (direction === 0) {
        previewModalCurrentZoom = 1;
      } else {
        const step = 0.25;
        previewModalCurrentZoom = Math.max(0.25, Math.min(4, previewModalCurrentZoom + direction * step));
      }
      renderPreviewModal(false);
    }

    async function renderPreviewModal(isFit) {
      if (!previewModalPdfUrl) return;
      try {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        if (!previewModalPdfDoc) {
          const timestamp = Date.now();
          const pdfUrl = previewModalPdfUrl.includes('?')
            ? `${previewModalPdfUrl}&t=${timestamp}`
            : `${previewModalPdfUrl}?t=${timestamp}`;
          previewModalPdfDoc = await pdfjsLib.getDocument(pdfUrl).promise;
        }

        const page = await previewModalPdfDoc.getPage(1);
        const canvas = document.getElementById('previewModalCanvas');
        if (!canvas) return;
        const context = canvas.getContext('2d');
        if (!context) return;

        const container = canvas.closest('.modal-body');
        if (!container) return;

        const containerWidth = container.clientWidth - 16;
        const containerHeight = container.clientHeight - 16;
        const viewport = page.getViewport({ scale: 1 });

        if (isFit) {
          // Calculate base scale to fit container
          previewModalBaseScale = Math.min(
            containerWidth / viewport.width,
            containerHeight / viewport.height,
            3
          );
        }

        const finalScale = previewModalBaseScale * previewModalCurrentZoom;
        const scaledViewport = page.getViewport({ scale: finalScale * 2 });

        canvas.width = scaledViewport.width;
        canvas.height = scaledViewport.height;
        canvas.style.width = scaledViewport.width / 2 + 'px';
        canvas.style.height = scaledViewport.height / 2 + 'px';

        await page.render({ canvasContext: context, viewport: scaledViewport }).promise;

        // Update zoom label
        const zoomPercent = Math.round(previewModalCurrentZoom * 100);
        document.getElementById('previewModalZoomLabel').textContent = `${zoomPercent}%`;
      } catch (error) {
        console.error('Preview modal render failed:', error);
      }
    }

    // Reset pdf doc cache when preview modal closes
    function initPreviewModalReset() {
      const previewModalEl = document.getElementById('previewModal');
      if (previewModalEl) {
        previewModalEl.addEventListener('hidden.bs.modal', () => {
          previewModalPdfDoc = null;
          previewModalPdfUrl = null;
          previewModalCurrentZoom = 1;
        });

        // Scroll wheel zoom in preview modal
        previewModalEl.addEventListener('wheel', (e) => {
          if (e.ctrlKey || e.metaKey) {
            e.preventDefault();
            const direction = e.deltaY < 0 ? 1 : -1;
            previewModalZoom(direction);
          }
        }, { passive: false });
      }
    }

    // ===== Compile =====
    async function compileQuestion(id, event) {
      if (event) event.stopPropagation();
      showToast(i18n[currentLang].compiling, 'info');
      try {
        const body = { force: true };
        const mp = collectModuleParams();
        if (mp) body.module_params = mp;
        const response = await fetch(`${API_BASE}/compile/${id}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const result = await response.json();
        if (result.success && result.pdf_path) {
          const pdfUrl = result.pdf_path.replace('./cache/', '/cache/');
          const questionIndex = allQuestions.findIndex(q => q.id === id);
          if (questionIndex !== -1) { allQuestions[questionIndex].pdf_url = pdfUrl; }
          displayQuestions(allQuestions);
          if (currentQuestion && currentQuestion.id === id) {
            currentQuestion.pdf_url = pdfUrl;
            const previewContainer = document.getElementById('previewContainer');
            if (previewContainer) {
              previewContainer.innerHTML = '<canvas id="pdfCanvas" style="width: 100%; height: auto;"></canvas>';
              setTimeout(async () => {
                const success = await renderPDF(pdfUrl);
                if (success) {
                  showToast(i18n[currentLang].compileSuccess, 'success');
                } else {
                  previewContainer.innerHTML = `
                    <div class="no-compile-hint">
                      <i class="bi bi-check-circle text-success"></i>
                      <p>${i18n[currentLang].compileSuccess}</p>
                    </div>
                  `;
                }
              }, 500);
            }
          } else {
            showToast(i18n[currentLang].compileSuccess, 'success');
          }
        } else {
          showToast(result.error || i18n[currentLang].compileFailed, 'error');
        }
      } catch (error) {
        console.error('编译失败:', error);
        showToast(i18n[currentLang].compileFailed, 'error');
      }
    }

    let exportQuestionOrder = [];

    function collectModuleParams() {
      // Mode: collect all checked checkboxes into a comma-separated string

        .map(cb => cb.value);

        papersize: document.getElementById('exportPapersize')?.value || 'A4',

        heightcount: parseInt(document.getElementById('exportHeightcount')?.value) || 40,

        fontsize: document.getElementById('exportFontsize')?.value || '11pt',
        fontstyle: document.getElementById('exportFontstyle')?.value || 'rm',
        themecolor: document.getElementById('exportThemecolor')?.value || '',

    function renderExportQuestionList() {
      const list = document.getElementById('exportQuestionList');
      if (exportQuestionOrder.length === 0) {
        list.innerHTML = `<div class="export-q-empty">${i18n[currentLang].noQuestionsSelected}</div>`;
        return;
      }
      list.innerHTML = exportQuestionOrder.map((id, idx) => {
        const q = allQuestions.find(q => q.id === id);
        const summary = q ? (q.content || '').substring(0, 40) : '';
        return `
          <div class="export-q-item" draggable="true" data-id="${id}" data-idx="${idx}">
            <span class="drag-handle"><i class="bi bi-grip-vertical"></i></span>
            <span class="q-order">${idx + 1}</span>
            <span class="q-summary">#${id} ${escapeHtml(summary)}${summary.length >= 40 ? '…' : ''}</span>
            <div class="q-move-btns">
              <button class="btn btn-ghost" onclick="moveExportItem(${idx}, -1)" title="${i18n[currentLang].moveUp}"><i class="bi bi-chevron-up"></i></button>
              <button class="btn btn-ghost" onclick="moveExportItem(${idx}, 1)" title="${i18n[currentLang].moveDown}"><i class="bi bi-chevron-down"></i></button>
            </div>
          </div>`;
      }).join('');
      bindDragEvents(list);
    }

    function bindDragEvents(list) {
      const items = list.querySelectorAll('.export-q-item');
      items.forEach(item => {
        item.addEventListener('dragstart', (e) => {
          dragSrcIdx = parseInt(item.dataset.idx);
          item.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });
        item.addEventListener('dragend', () => {
          item.classList.remove('dragging');
          dragSrcIdx = null;
        });
        item.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
        });
        item.addEventListener('drop', (e) => {
          e.preventDefault();
          const targetIdx = parseInt(item.dataset.idx);
          if (dragSrcIdx !== null && dragSrcIdx !== targetIdx) {
            const [moved] = exportQuestionOrder.splice(dragSrcIdx, 1);
            exportQuestionOrder.splice(targetIdx, 0, moved);
            renderExportQuestionList();
          }
        });
      });
    }

    function moveExportItem(idx, direction) {
      const newIdx = idx + direction;
      if (newIdx < 0 || newIdx >= exportQuestionOrder.length) return;
      [exportQuestionOrder[idx], exportQuestionOrder[newIdx]] =
        [exportQuestionOrder[newIdx], exportQuestionOrder[idx]];
      renderExportQuestionList();
    }

    function openExportModal() {
      if (selectedQuestions.size === 0) { showToast(i18n[currentLang].selectQuestionsFirst, 'error'); return; }
      exportQuestionOrder = Array.from(selectedQuestions);
      resetExportDefaults();
      renderExportQuestionList();
      // Bind layout change to toggle Hermes fields
      const layoutSelect = document.getElementById('exportLayout');
      if (layoutSelect && !layoutSelect._hermesBound) {
        layoutSelect.addEventListener('change', toggleHermesFields);
        layoutSelect._hermesBound = true;
      }
      // Switch to first tab (Order)
      const firstTab = new bootstrap.Tab(document.getElementById('exportOrderTab'));
      firstTab.show();
      const modal = new bootstrap.Modal(document.getElementById('exportModal'));
      modal.show();
    }

      const wantPdf = document.getElementById('exportFormatPdf').checked;

      const params = {
        question_ids: exportQuestionOrder,
        show_answer: document.getElementById('showAnswer').checked,
        show_more: document.getElementById('showMore').checked,
        ...collectModuleParams()
      };

      bootstrap.Modal.getInstance(document.getElementById('exportModal')).hide();
      showToast(i18n[currentLang].exporting, 'info');

      // Helper to download one format
      async function downloadFormat(endpoint, fallbackExt) {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(params)
        });
        if (response.ok) {
          const blob = await response.blob();
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          const disposition = response.headers.get('Content-Disposition') || '';
          const filename = disposition.split('filename=')[1]?.replace(/"/g, '') || `export.${fallbackExt}`;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          window.URL.revokeObjectURL(url);
          document.body.removeChild(a);
          return true;
        } else {
          const result = await response.json();
          showToast(result.error || i18n[currentLang].exportFailed, 'error');
          return false;
        }
      }

      try {
        if (wantTex) {
          await downloadFormat(`${API_BASE}/export`, 'tex');
        }
        if (wantPdf) {
          await downloadFormat(`${API_BASE}/export/pdf`, 'pdf');
        }
        if (wantTex || wantPdf) {
          showToast(i18n[currentLang].exportSuccess, 'success');
        }
      } catch (error) { console.error('导出失败:', error); showToast(i18n[currentLang].exportFailed, 'error'); }
    }

    // ===== Delete =====
    async function deleteSelected() {
      if (selectedQuestions.size === 0) { showToast(i18n[currentLang].selectQuestionsFirst, 'error'); return; }
      if (!confirm(i18n[currentLang].confirmDelete)) return;
      try {
        for (const id of selectedQuestions) { await fetch(`${API_BASE}/questions/${id}`, { method: 'DELETE' }); }
        showToast(i18n[currentLang].deleteSuccess, 'success');
        selectedQuestions.clear();
        currentQuestion = null;
        showRightPanelEmpty();
        loadQuestions();
      } catch (error) { console.error('删除失败:', error); showToast('Error', 'error'); }
    }

    // ===== Init =====
    document.addEventListener('DOMContentLoaded', () => {
      updateUILanguage();
      loadQuestions();
      showRightPanelEmpty();
      updateBackdrop();
      initPreviewModalReset();
      // Re-evaluate backdrop on resize
      window.addEventListener('resize', updateBackdrop);
    });
  </script>
</body>

</html>
